<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Black Letter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="description" content="Rule drilling, blank-page recall, and attack outlines for 1Ls." />

<!-- home screen / standalone -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Black Letter" />
<meta name="theme-color" content="#23355C" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" href="./icon-192.png" />

<style>
  html { -webkit-text-size-adjust: 100%; background: #1c1913; }
  body { margin: 0; overscroll-behavior-y: contain; }
  #root { min-height: 100vh; }
  /* respect the notch / home indicator in standalone mode */
  .desk {
    padding-top: env(safe-area-inset-top) !important;
    padding-bottom: calc(48px + env(safe-area-inset-bottom)) !important;
    padding-left: max(16px, env(safe-area-inset-left)) !important;
    padding-right: max(16px, env(safe-area-inset-right)) !important;
  }
  /* iOS zooms the viewport when a focused input is under 16px — never let that happen */
  @media (max-width: 820px) {
    input, textarea, select { font-size: 16px !important; }
    .blank { font-size: 16px !important; }
    .blurtbox { font-size: 17px !important; line-height: 32px !important; }
    .prompt { font-size: 20px !important; line-height: 31px !important; }
    .blurt-topic { font-size: 26px !important; }
    .pad { transform: none !important; }
    .attack-pad { transform: none !important; }
    .tab, .chip { padding: 9px 15px !important; }   /* bigger tap targets */
    .mcq { padding: 13px 14px !important; }
    .clitem { padding: 11px 0 !important; }
    .btn { padding: 13px 22px !important; }
  }
  .implabel { cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

ormation ingredients",text:"Formation needs all three: an {{offer}} and an {{acceptance}} \u2014 together, the meeting of the {{minds}} \u2014 plus {{consideration}}, the bargained-for exchange.",why:"The professor's asterisk on 'Need* all three': promissory estoppel and restitution are the workarounds when an ingredient is missing."},{id:"c-objective",type:"cloze",concept:"Objective theory \u2014 Lucy v. Zehmer",text:"We must look to the {{outward}} expression of a person as manifesting his intention rather than to his {{secret}} and unexpressed intention; the law imputes an intention corresponding to the {{reasonable}} meaning of his words and acts.",why:"Lucy v. Zehmer, 84 S.E.2d 516 (Va. 1954): drunk or not, the parties memorialized an unambiguous agreement \u2014 they're stuck with it."},{id:"c-consid-types",type:"flash",concept:"Consideration \u2014 four types",prompt:"The four types of consideration, with the professor's examples?",answer:["1) Return promise \u2014 'I'll pay you $100 if you promise to pay me $110 next year.'","2) Performance: an act other than a promise \u2014 '$100 once you sing Bohemian Rhapsody.'","3) Performance: forbearance \u2014 '$100 if you do not punch me.'","4) Performance: affecting legal relations \u2014 '$100 if you accept termination from my company.'"],fallback:"A return {{promise}}; an {{act}} other than a promise; {{forbearance}}; or affecting legal {{relations}}.",why:"Bargained-for exchange, per the Restatement \u2014 each type is something sought by the promisor and given in exchange."},{id:"c-dougherty",type:"flash",concept:"Dougherty v. Salt",prompt:"Dougherty v. Salt \u2014 what's the rule from the aunt's promissory note?",answer:["Consideration that has already been received doesn't support a future promise.","The note to the nephew was a gratuitous promise dressed as a contract \u2014 no exchange, no enforcement."],fallback:"Consideration {{already}} received does not support a {{future}} promise.",why:"Past consideration is no consideration \u2014 the same defect that later sinks Mills and Harrington."},{id:"c-hamer",type:"flash",concept:"Hamer v. Sidway",prompt:"Hamer v. Sidway \u2014 what counted as consideration, and what did the uncle's estate argue?",answer:["Abstaining from exercising your legal right can be consideration \u2014 the nephew gave up drinking, cards, etc. until 21.","The estate argued the uncle received no benefit \u2014 the court held benefit to the promisor is not required; the promisee's forbearance (giving up a legal right) is enough."],fallback:"{{Abstaining}} from exercising a legal {{right}} can be consideration; a {{benefit}} to the promisor is not required.",why:"Second issue: the nephew argued the uncle held the $5,000 in trust \u2014 which defeated the statute-of-limitations defense."},{id:"c-military",type:"flash",concept:"Military College v. Brooks \u2014 \xA7 74(1)",prompt:"When is forbearance from asserting a claim valid consideration?",answer:["Forbearance from asserting a claim is valid consideration.","But forbearing an INVALID claim is not consideration unless: (a) the claim or defense is in fact doubtful due to uncertainty of facts or law, OR (b) the forbearing party believes the claim may be fairly determined to be valid."],fallback:"Forbearing an invalid claim is not consideration unless the claim is {{doubtful}} as to facts or law, or the forbearing party {{believes}} it may fairly be determined valid.",why:"Restatement 2d \xA7 74(1). The line between settlement and extortion \u2014 good-faith doubt is what separates them."},{id:"c-langer",type:"flash",concept:"Langer v. Superior Steel",prompt:"Langer v. Superior Steel \u2014 how much benefit to the promisor is enough for consideration?",answer:["Almost any benefit to the promisor is consideration.","'It is reasonable to conclude that it is to the advantage of the [promisor] if the [promisee] ... is not employed by a competitive company.'"],fallback:"Almost {{any}} benefit to the {{promisor}} is consideration \u2014 e.g., the retiree not working for a {{competitive}} company.",why:"Contrast Kirksey: a real (even small) benefit flowing to the promisor is exchange; a condition merely necessary to receive a gift is not."},{id:"c-kirksey",type:"flash",concept:"Kirksey v. Kirksey \u2014 gift vs. consideration",prompt:"Kirksey v. Kirksey \u2014 why did the widow lose, and what's the exchange vs. gratuitous condition test?",answer:["If the 'consideration' is just a necessary requirement of receiving the gift, it may not be valid consideration \u2014 her move was merely the condition of a gratuity.","Exchange: going to the store to get out of the photograph is a BENEFIT to the promisor.","Gratuitous condition: going to the store is merely necessary to effect the gift."],fallback:"A condition merely {{necessary}} to receive a {{gift}} is not consideration; ask whether the act is a {{benefit}} to the promisor.",why:"The brother-in-law's letter induced her to abandon her land \u2014 but inducement alone isn't bargain. (Modern lawyers would plead promissory estoppel.)"},{id:"c-pe-elements",type:"flash",concept:"Promissory estoppel \u2014 Restatement \xA7 90",prompt:"Promissory estoppel: the four elements the asserting party must prove, with the professor's gloss on each?",answer:["1) A promise \u2014 not an entire contract; just a promise, but it must be sufficiently definite.","2) Promisor should reasonably expect it to induce action or forbearance \u2014 focus on the promisor's objective reasonableness.","3) It ACTUALLY induces the action or forbearance \u2014 only counts if it does.","4) Injustice can be avoided only by enforcement \u2014 the final stopgap."],fallback:"1) A sufficiently definite {{promise}} 2) promisor should reasonably {{expect}} it to induce action or {{forbearance}} 3) it {{actually}} induces it 4) {{injustice}} avoidable only by enforcement.",why:"Reliance as a SUBSTITUTE for consideration \u2014 remedy may be limited as justice requires."},{id:"c-ricketts",type:"flash",concept:"Ricketts v. Scothorn",prompt:"Ricketts v. Scothorn \u2014 what doctrine, and what's the takeaway?",answer:["Equitable estoppel (estoppel in pais) applied to a promise: grandfather's note induced her to quit her job.","Justified reliance on a promise can make it enforceable \u2014 the promisor is precluded from asserting lack of consideration after inducing the change of position."],fallback:"{{Justified}} reliance on a promise can create an enforceable obligation \u2014 estoppel in {{pais}}.",why:"The historical bridge to \xA7 90 promissory estoppel."},{id:"c-stewart",type:"flash",concept:"Stewart v. Cendant Mobility",prompt:"Stewart v. Cendant \u2014 what was the reliance, and why did she win on estoppel after losing on contract?",answer:["The reliance: she STAYED with the company (and didn't pursue other employment) on the assurance that her husband joining a competitor wouldn't affect her job.","The jury found no contract (no definite offer) \u2014 but promissory estoppel doesn't require the promise to be the functional equivalent of an offer. Reliance did the work consideration would have done."],fallback:"Her {{reliance}} was staying and not seeking other work; a \xA7 90 promise need not equal a contractual {{offer}}.",why:"The card-catalog error to avoid: her staying was RELIANCE, not consideration \u2014 no contract ever formed."},{id:"c-ue-elements",type:"flash",concept:"Unjust enrichment \u2014 elements & benefits",prompt:"Unjust enrichment: the two elements, and the four example categories of 'benefit'?",answer:["1) Receipt of a benefit from the plaintiff, AND 2) retention of the benefit is unjust. The plaintiff must show both.","Benefits: grant of possessory interest (money, land, possessions); performing services (beneficial to, or at the request of, the defendant); satisfaction of the defendant's debt; other benefits ('in any way adds to the other's advantage')."],fallback:"1) Receipt of a {{benefit}} from plaintiff 2) retention is {{unjust}}; benefits include a possessory {{interest}}, performing {{services}}, satisfying a {{debt}}, or anything adding to the other's advantage.",why:"Restitution is SUBORDINATE to contracts \u2014 if a contract governs, restitution stays out."},{id:"c-ue-exceptions",type:"flash",concept:"Unjust enrichment \u2014 element 2 exceptions",prompt:"Unjust enrichment's second element is that retaining the benefit is unjust. What are the two exceptions that make retention NOT unjust?",answer:["Unrequested benefit voluntarily conferred: gratuitously choosing to confer a benefit instead of entering a contract creates no compensation obligation.","Forced exchange: receiving unrequested services the party would not necessarily have purchased at market value creates no compensation obligation."],fallback:"An unrequested benefit {{voluntarily}} conferred, and a {{forced}} exchange \u2014 neither creates a {{compensation}} obligation.",why:"The lumberjack hypo: cutting a neighbor's dying tree unasked is both a volunteer's gratuity and a forced exchange."},{id:"c-sparks",type:"flash",concept:"Sparks v. Gustafson",prompt:"Sparks v. Gustafson \u2014 outcome, and how did the court distinguish Kershaw?",answer:["Inequitable for the Estate to receive professional services while retaining the benefits of those services \u2014 Gustafson recovers.","Kershaw distinguished: those were the ordinary favors of a long-time friend; Gustafson's were extensive BUSINESS services (managing, repairing, paying bills out of pocket for years) \u2014 the kind one would ordinarily expect to pay for."],fallback:"Inequitable for the Estate to receive {{professional}} services while retaining their {{benefits}}; unlike Kershaw, these went beyond what {{friendship}} ordinarily provides.",why:"The gratuitous-services exception has a ceiling: extent and business character override the friendship inference."},{id:"c-moral-2types",type:"flash",concept:"Promises for benefits received \u2014 two types",prompt:"The professor's two categories of promises for benefits received, and their default enforceability?",answer:["1) Gratitude for past actions / moral consideration \u2192 NOT always enforceable.","2) Subsequent affirmation of an unenforceable promise \u2192 TYPICALLY enforceable."],fallback:"Gratitude for {{past}} actions \u2014 not always enforceable; subsequent {{affirmation}} of an unenforceable promise \u2014 typically enforceable.",why:"Mills v. Wyman lives in category one: certain promises for benefits received are unenforceable notwithstanding any 'moral obligation.'"},{id:"c-moral-split",type:"flash",concept:"When is moral consideration enough?",prompt:"The jurisdictional split on moral consideration \u2014 three positions, and the case for each side of the Webb/Harrington divide?",answer:["YES \u2014 a material benefit received can support an enforceable promise (Webb v. McGowin: Webb saved McGowin's life at the cost of his own ability to work; monthly payments enforced against the estate).","YES, BUT \u2014 the promise is enforceable only to the extent of the benefit.","NO \u2014 bargained-for exchange required at the moment of contract (Mills v. Wyman; Harrington v. Taylor: hand mutilated saving an attacker from an axe, promise still unenforceable)."],fallback:"Yes \u2014 {{material}} benefit can support the promise (Webb); yes-but \u2014 only to the {{extent}} of the benefit; no \u2014 {{bargained}}-for exchange required at contracting (Mills, Harrington).",why:"Professor's ambiguity playbook: exams and the bar \u2014 argue BOTH interpretations; in practice \u2014 advise and prep backup arguments; friends & family \u2014 refer out."},{id:"c-rest86",type:"flash",concept:"Restatement \xA7 86 \u2014 the resolution",prompt:"How does Restatement \xA7 86 resolve the moral-consideration problem?",answer:["A promise made in recognition of a benefit previously received by the promisor from the promisee is binding to the extent necessary to prevent injustice.","NOT binding if the promisee conferred the benefit as a gift, or the promisor was not unjustly enriched \u2014 or to the extent its value is disproportionate to the benefit."],fallback:"Binding to the extent necessary to prevent {{injustice}}; not binding if conferred as a {{gift}} or to the extent {{disproportionate}} to the benefit.",why:"Note the anchor: benefit received by the PROMISOR \u2014 a third party's gratitude (Charlie promising for Bob's rescue) falls outside it."},{id:"c-offer-def",type:"cloze",concept:"Offer \u2014 Restatement \xA7\xA7 24, 26",text:"An offer is the {{manifestation}} of willingness to enter into a bargain, so made as to {{justify}} another person in understanding that their {{assent}} to that bargain is invited and will {{conclude}} it.",why:"\xA7 26's flip side: no offer if the addressee knows or has reason to know the maker doesn't intend to conclude a bargain without a further manifestation of assent. If 'I accept' would create mutual obligations \u2014 it's probably an offer."},{id:"c-offer-factors",type:"flash",concept:"Factors indicating an offer",prompt:"The eight factors indicating an offer (and your mnemonic)?",answer:["Finality \u2014 willing to be bound on acceptance? \xB7 Completeness \u2014 substantially all terms? \xB7 Context \u2014 indicates hope for acceptance? \xB7 Audience \u2014 broad audience is less likely an offer.","Jargon \u2014 'this is a legally binding offer' tends to make it so \xB7 Method of acceptance \u2014 specifying one makes it more offer-like \xB7 Public policy/fairness \u2014 exploiting ambiguity cuts against binding \xB7 Accepted practice \u2014 course of dealing can bind.","Mnemonic: Fuckin Critics Can't Always Judge My Poor Attitude."],fallback:"{{Finality}}, {{completeness}}, context, {{audience}}, jargon, method of {{acceptance}}, public policy, accepted {{practice}}.",why:"The professor's caveat, twice on the slides: NONE of these is necessarily dispositive \u2014 they're weighing factors, not elements."},{id:"c-moulton",type:"flash",concept:"Moulton v. Kershaw",prompt:"Moulton v. Kershaw \u2014 why wasn't the salt letter an offer?",answer:["A general proposal is not necessarily an offer.","'We are authorized to offer' read as trade solicitation, addressed generally; no quantity term bounded what Kershaw was willing to sell \u2014 an order for 2,000 barrels couldn't close a deal that never fixed an amount."],fallback:"A {{general}} proposal is not necessarily an offer \u2014 solicitation language plus no {{quantity}} limit.",why:"The court's counterfactual: 'we will sell you all the salt you will order' WOULD have been binding."},{id:"c-nordyne",type:"flash",concept:"Nordyne v. ICM",prompt:"Nordyne v. ICM \u2014 when can a price quotation be an offer, and what was the acceptance here?",answer:["Price quotations can be offers based on the course of dealing of the parties and the manner in which they invite acceptance.","ICM's July 29 quotation (negotiated for months, complete terms, sent to one buyer, custom product) = OFFER; Nordyne's September 15 signature on ICM's sign-off letter = ACCEPTANCE \u2014 which is why ICM's invoice terms (forum selection) governed."],fallback:"Quotations can be offers based on the course of {{dealing}} and the manner of inviting {{acceptance}}; the {{quotation}} was the offer and the production sign-off the acceptance.",why:"Restatement \xA7 26 cmt. c factors: prior inquiry, completeness of terms, number of recipients."},{id:"c-fairmount",type:"flash",concept:"Fairmount Glass Works",prompt:"Fairmount Glass Works \u2014 was the seller's quote an offer? Reconcile with Moulton.",answer:["Yes. The buyer asked for the lowest price on a SPECIFIC order \u2014 ten car loads of Mason jars \u2014 and the seller quoted prices 'for immediate acceptance.'","Reconciliation: a quote RESPONDING to a specific inquiry (quantity supplied by the inquiry) with acceptance-inviting language is an offer; Moulton's letter was unsolicited, general, and quantity-less."],fallback:"A quote answering a {{specific}} inquiry, with quantity fixed by the inquiry, 'for immediate {{acceptance}}' \u2014 an {{offer}}, unlike Moulton's general letter.",why:"The middle case in the Moulton \u2192 Fairmount \u2192 Nordyne line: context and invitation language flip a 'quote' into an offer."},{id:"c-ad-test",type:"flash",concept:"Is an advertisement an offer?",prompt:"The three questions for whether an advertisement is an offer, with the case anchors?",answer:["1) Performance \u2014 was some performance promised in positive terms in return for something requested?","2) Definiteness \u2014 is it clear, definite, and explicit, leaving nothing open for negotiation? (Lefkowitz: '1 Black Lapin Stole ... $1.00 First Come First Served' \u2014 offer, accepted by being first.)","3) Other facts \u2014 do circumstances show the advertiser intended an offer? (Leonard: obvious joke, terms deferred to catalog, no limiting words \u2014 no offer.)","Default (Craft v. Elder & Johnston): absent special circumstances, an ad is a mere invitation for the audience to make an offer."],fallback:"1) {{performance}} promised in positive terms for something requested 2) clear, {{definite}}, explicit, nothing open for {{negotiation}} 3) other {{facts}} showing intent. Default: an ad is an {{invitation}} to make an offer.",why:"Craft states the rule, Lefkowitz the exception, Leonard the limit \u2014 one line of doctrine, three cases."},{id:"c-acceptance-def",type:"cloze",concept:"Acceptance \u2014 Restatement \xA7 50",text:"An acceptance is the manifestation of {{assent}} to the terms of the offer, made by the {{offeree}} in a manner {{invited}} or required by the offer.",why:"Mirror of \xA7 24: the offeror is master of the offer \u2014 the manner of acceptance is the offeror's to set."},{id:"c-accept-factors",type:"flash",concept:"Acceptance factors",prompt:"The six acceptance factors (and your mnemonic)?",answer:["Finality of acceptance \u2014 if the proposal lets the offeror approve the 'acceptance,' the proposal was never an offer.","Method \u2014 by default, an offer invites acceptance in any reasonable manner.","Acceptance by Promise \xB7 Acceptance by Performance.","Mirror image rule \u2014 changing a material term = counteroffer; requesting changes without conditioning = still an acceptance (UCC has special rules \u2014 Sept. 1).","Notice \u2014 the offeree must normally inform the offeror before the offer expires.","Mnemonic: For My Pretty Panda Ms. Nori."],fallback:"{{Finality}}, {{method}}, acceptance by {{promise}}, acceptance by {{performance}}, the {{mirror}} image rule, and {{notice}}.",why:"Nonexhaustive factors, same as the offer side \u2014 not elements."},{id:"c-promise-v-perf",type:"flash",concept:"Acceptance by promise vs. performance",prompt:"What completes acceptance by promise vs. by performance \u2014 and what if the offer is ambiguous?",answer:["Promise: the offeree must complete every act essential to the making of the promise (including notice).","Performance: at least part of what the offer requests must be performed or tendered \u2014 mere preparation to perform is insufficient.","Ambiguous offer: the offeree can accept by promise OR performance."],fallback:"Promise: complete every act essential to {{making}} the promise; performance: at least {{part}} performed or tendered \u2014 mere {{preparation}} is insufficient; if ambiguous, {{either}} works.",why:"Restatement \xA7 50 \u2014 the porch, cottage, and 'ship at once' hypos all turn on which mode the offer invites."},{id:"c-hendricks",type:"flash",concept:"Hendricks v. Behee",prompt:"Hendricks v. Behee \u2014 the notice rule, and why did Behee win?",answer:["'There is no contract until acceptance of an offer is communicated to the offeror. An uncommunicated intention to accept is not an acceptance. When an offer calls for a promise, notice of acceptance is always essential.'","The Smiths signed but never communicated; Behee revoked through the Smiths' agent first \u2014 notice to an agent within the scope of authority is notice to the principal. No contract."],fallback:"When acceptance must be made by {{promise}}, the offeror must receive {{actual}} notice; notice to an {{agent}} within authority binds the principal.",why:"Hendricks himself was just the escrow agent interpleading the $5,000 deposit \u2014 the fight was Behee vs. the Smiths."},{id:"c-ardente",type:"flash",concept:"Ardente v. Horan \u2014 conditional acceptance",prompt:"Restatement \xA7\xA7 59 & 61 on conditional acceptance, and how it played out in Ardente?",answer:["\xA7 59: a reply that purports to accept but is CONDITIONAL on assent to additional or different terms is not an acceptance \u2014 it's a counteroffer.","\xA7 61: an acceptance that merely REQUESTS a change is not invalidated \u2014 unless the acceptance is made to depend on assent to the change.","Ardente: conditioning the acceptance on inclusion of the sun parlor furniture converted the acceptance into a counteroffer \u2014 no contract."],fallback:"A {{conditional}} acceptance is a {{counteroffer}}; a mere {{request}} for changes survives unless the acceptance is made to {{depend}} on assent.",why:"An acceptance that doesn't mirror the offer may not be valid \u2014 watch for 'confirm that X is part of the transaction' language."},{id:"c-termination",type:"flash",concept:"Terminating the offer \u2014 five ways",prompt:"The five ways an offer terminates?",answer:["1) Rejection \u2014 ends the acceptability of the offer.","2) Revocation \u2014 any time prior to acceptance.","3) Counteroffer \u2014 acts as a rejection (a conditional acceptance can be a counter).","4) Lapse of time \u2014 after a 'reasonable amount of time' or the time stated in the offer.","5) Death of the offeror \u2014 death of the offeror means the death of the offer."],fallback:"{{Rejection}}, {{revocation}}, {{counteroffer}}, {{lapse}} of time, and {{death}} of the offeror.",why:"After termination, the offer cannot be accepted \u2014 the power of acceptance is gone."},{id:"c-dodds",type:"flash",concept:"Dickinson v. Dodds + Restatement \xA7\xA7 43, 87(2)",prompt:"Dickinson v. Dodds \u2014 the two rules, plus the two Restatement follow-ons?",answer:["Revoking the offer before acceptance terminates the offer \u2014 the promise to hold it open until Friday, without consideration, was not binding.","Key quote: 'It is impossible ... to say there was ever that existence of the same mind between the two parties which is essential ... to the making of an agreement.'","\xA7 43 (revocation through action): the power of acceptance ends when the offeror takes definite action inconsistent with the proposed contract AND the offeree acquires reliable information of it.","\xA7 87(2): an offer that should reasonably be expected to induce substantial reliance before acceptance, and does, is binding as an OPTION CONTRACT to the extent necessary to prevent injustice."],fallback:"A gratuitous hold-open promise is not {{binding}}; the power of acceptance ends on definite {{inconsistent}} action plus {{reliable}} information; substantial pre-acceptance {{reliance}} can create an option under \xA7 87(2).",why:"Dickinson knew Dodds was selling to Allan before 'accepting' \u2014 the minds never met at the moment of acceptance."},{id:"c-mailbox",type:"cloze",concept:"Mailbox rule \u2014 Restatement \xA7 63(a)",text:"Unless the offer provides otherwise, an acceptance made in an invited manner is operative as soon as put out of the offeree's {{control}} \u2014 regardless of whether it ever {{reaches}} the offeror; but revocations, rejections, and second-move acceptances are valid only upon actual {{receipt}}.",why:"Morrison v. Thoelke: the contract is complete on MAILING, barring repudiation before delivery. The professor's slide: WARNING \u2014 dispatch timing applies ONLY to first-move acceptances."},{id:"c-overtake",type:"flash",concept:"Mailbox \u2014 overtaking rule",prompt:"You mail a rejection, then change your mind and mail an acceptance. What result?",answer:["A rejection or counteroffer by mail does not terminate the power of acceptance until RECEIVED.","But an acceptance dispatched AFTER sending a rejection is only a counteroffer \u2014 unless the acceptance is received by the offeror BEFORE the rejection arrives (the race)."],fallback:"A mailed rejection is effective only on {{receipt}}; an acceptance sent after a rejection is a {{counteroffer}} unless it {{arrives}} first.",why:"The one scenario where the mailbox rule's dispatch timing gets suspended \u2014 the second move must win the race."},{id:"c-mcq-ucc",type:"mcq",concept:"UCC vs. common law",scenario:"A contract for the sale of a cell phone. Which body of law governs?",options:["Common law \u2014 all consumer contracts are common law","UCC Article 2 \u2014 a cell phone is a good","Common law \u2014 unless the phone costs over $500","Both apply equally"],correct:1,explanation:"UCC Article 2 applies to transactions in goods \u2014 movable, tangible things like a phone. Common law (Restatement) governs services. First question in every contracts problem: goods or services?",why:"The professor's Day 2 hypo, verbatim."},{id:"c-mcq-porch",type:"mcq",concept:"Acceptance by performance \u2014 porch hypo",scenario:"Alice, leaving on a month's vacation, tells Bob she'll pay $50 if he paints her porch while she's away. Bob says he may not have time; Alice says he may decide after she leaves. Bob begins painting after Alice leaves. Has Bob accepted?",options:["No \u2014 Bob never communicated acceptance to Alice","Yes \u2014 the offer invited acceptance by performance, and beginning the invited performance is acceptance","No \u2014 acceptance occurs only when the porch is fully painted","Yes \u2014 but only if Alice learns of the painting before returning"],correct:1,explanation:"Alice's offer sought performance, not a promise \u2014 and she expressly told Bob to decide after she left, waiving advance notice. Beginning the invited performance (actually painting, not merely buying brushes) operates as acceptance.",why:"Contrast mere preparation, which is insufficient \u2014 the brush must hit the porch."},{id:"c-mcq-cottage",type:"mcq",concept:"Acceptance by promise \u2014 cottage hypo",scenario:"Sydney mails Johnny plans for a cottage on Sydney's remote wilderness land, writing: 'If you will AGREE to build a cottage in accordance with the enclosed plans, I will pay you $5,000.' Johnny never responds \u2014 but starts building. Can Johnny demand the $5,000?",options:["Yes \u2014 beginning performance always accepts an offer","No \u2014 the offer called for a promise ('if you will agree'), so acceptance required a communicated promise, not silent performance","Yes \u2014 Sydney's offer was ambiguous, so either mode works","No \u2014 building on another's land is trespass, voiding the contract"],correct:1,explanation:"'If you will AGREE to build' seeks a return promise. When an offer calls for a promise, notice of acceptance is always essential (Hendricks) \u2014 silently starting to build in a remote wilderness, where Sydney would never learn of it, is not the invited acceptance.",why:"Compare the porch hypo: the offer's language picks the mode, and the mode dictates whether notice is required."},{id:"c-mcq-ship",type:"mcq",concept:"Ambiguous mode \u2014 'Ship at once' hypo",scenario:"Billy mails Jane a written order for a machine she regularly sells from stock. The order says 'Ship at once.' Jane immediately mails a letter of acceptance instead of shipping. Valid acceptance?",options:["No \u2014 'Ship at once' demanded performance, and only shipment accepts","Yes \u2014 the offer is ambiguous as to mode, so the offeree may accept by prompt promise OR prompt performance","No \u2014 merchants can only accept by shipping goods","Yes \u2014 but the contract forms only when the machine arrives"],correct:1,explanation:"'Ship at once' is ambiguous \u2014 it expresses urgency, not an exclusive mode. Where the offer is ambiguous, the offeree can accept by promise or performance; Jane's immediate mailed acceptance forms the contract (effective on dispatch, per the mailbox rule).",why:"The default: an offer invites acceptance in any reasonable manner unless it clearly says otherwise."},{id:"c-mcq-mailbox",type:"mcq",concept:"Mailbox rule \u2014 Yael & Zed",scenario:"July 1: Yael mails Zed an offer. July 2: Yael mails a revocation. July 3: Zed receives the offer and mails back an acceptance. July 4: Zed receives the revocation. July 5: Yael receives the acceptance. Contract?",options:["No \u2014 the revocation was mailed before Zed ever accepted","Yes \u2014 the acceptance was effective on dispatch (July 3), before the revocation became effective on receipt (July 4)","No \u2014 Yael received the acceptance after Zed knew of the revocation","Yes \u2014 but only because Yael's revocation was mailed too early"],correct:1,explanation:"Acceptances are effective on DISPATCH (mailbox rule); revocations are effective only on RECEIPT. The acceptance operated July 3; the revocation didn't land until July 4 \u2014 one day too late. Contract formed July 3.",why:"Timeline problems are won by labeling each communication with its effective date before comparing."},{id:"c-mcq-amps",type:"mcq",concept:"Ads as offers \u2014 Lefkowitz pattern",scenario:"'Saturday 8 A.M. Sharp \u2014 2 vintage amps, worth $900. $5 each. First come, first served.' M arrives first, $5 in hand; the store refuses ('collectors only'). Was the ad an offer?",options:["No \u2014 advertisements are never offers","Yes \u2014 clear, definite, explicit, nothing open to negotiate, and performance (being first) was requested in positive terms","No \u2014 no consideration was paid to keep it open","Yes \u2014 any ad that states a price is an offer"],correct:1,explanation:"This runs the professor's three-part ad test: performance promised in positive terms for something requested (first come = served at $5), fully definite, and the limiting mechanism shows real intent. The 'house rule' came too late \u2014 an offeror can modify before acceptance, not after.",why:"Lefkowitz \u2014 the exception that proves Craft's default rule."},{id:"c-mcq-jet",type:"mcq",concept:"Ads as offers \u2014 Leonard pattern",scenario:"A TV spot jokingly shows a fighter jet 'for 7,000,000 points.' All redemption details live in a separate catalog, which omits the jet; nothing limits how many viewers could claim one. A viewer tenders $700,000 for points. Offer?",options:["Yes \u2014 an item plus a stated price is an offer","No \u2014 terms were deferred to the catalog, there were no limiting words, and an objective viewer would see a joke","Yes \u2014 the viewer's order form was an acceptance","No \u2014 TV ads can never be offers"],correct:1,explanation:"Leonard v. PepsiCo: the commercial fails all three ad-test questions \u2014 no positive-terms performance path (details deferred to the catalog), no limiting words capping acceptances, and the objective circumstances screamed joke. The order form was itself just an offer, never accepted.",why:"Lucy's objective theory working in the other direction: a reasonable person would NOT take it seriously."},{id:"c-mcq-dodds",type:"mcq",concept:"Revocation \u2014 Dickinson v. Dodds pattern",scenario:"Seller signs: 'This offer stays open until Friday 9 A.M.' Buyer pays nothing for that promise. Wednesday the seller sells to someone else; buyer hears of the sale that evening from a reliable third party, then tenders an 'acceptance' Thursday. Contract?",options:["Yes \u2014 the signed writing made the offer irrevocable","Yes \u2014 revocation must come from the offeror personally","No \u2014 the gratuitous hold-open promise wasn't binding, and \xA7 43 killed the power of acceptance once buyer reliably learned of the sale","No \u2014 real estate offers expire after 24 hours"],correct:2,explanation:"No consideration = no option, so the offer stayed freely revocable. Under Restatement \xA7 43, definite inconsistent action (selling to Allan) plus reliable information reaching the offeree terminates the power of acceptance \u2014 no formal notice from the offeror needed.",why:"Dickinson v. Dodds \u2014 and remember \xA7 87(2)'s reliance-based option as the modern counterweight."},{id:"c-mcq-timing",type:"mcq",concept:"Consideration timing \u2014 Mills pattern",scenario:"While N is nursing L back to health, L says: 'Keep taking care of me and I'll repay every cost when I recover.' N continues the care. L recovers, then refuses to pay. Enforceable?",options:["No \u2014 past consideration; the care was a completed act","Yes \u2014 bargained-for exchange: the promise induced continued care","No \u2014 promises to pay for services must be in writing","Yes \u2014 but only under the material benefit rule"],correct:1,explanation:"The promise came DURING performance and induced its continuation \u2014 a real exchange, unlike Mills v. Wyman, where the promise arrived only after the care had fully ended. Timing of the promise decides everything.",why:"Dougherty, Mills, and Harrington all fail on the same clock; this hypo moves the promise before the act completes."},{id:"c-hypo-piano",type:"mcq",concept:"Condition of gift vs. consideration \u2014 Kirksey line",scenario:"Grandmother tells her grandson: 'If you drive to my house on Sunday, I'll give you my old piano.' He drives the two hours; she refuses to hand it over. Enforceable contract?",options:["Yes \u2014 driving two hours is a detriment, and detriment is consideration (Hamer)","No \u2014 the drive was merely a condition necessary to receive the gift, not something the grandmother sought in exchange","Yes \u2014 any act performed at the promisor's request is consideration","No \u2014 promises between family members are never enforceable"],correct:1,explanation:"Kirksey: if the 'consideration' is just a necessary requirement of receiving the gift, it isn't valid consideration. Ask the Langer question \u2014 did the drive BENEFIT grandmother, or was it merely how he'd collect the gratuity? Contrast Hamer, where the forbearance was the very thing the uncle bargained for.",why:"The exchange-vs-gratuitous-condition line: benefit to the promisor is the tell."},{id:"c-hypo-claim",type:"mcq",concept:"Forbearance of an invalid claim \u2014 \xA7 74(1)",scenario:"N threatens to sue D over a property-line claim N privately knows is baseless, purely as leverage. D promises $2,000 if N drops it; N does. D refuses to pay. Consideration?",options:["Yes \u2014 forbearance from asserting a claim is always consideration","No \u2014 forbearing an invalid claim is not consideration where the claim isn't doubtful and the forbearing party doesn't believe in it","Yes \u2014 D received the benefit of avoiding litigation costs","No \u2014 settlement agreements require court approval"],correct:1,explanation:"Restatement \xA7 74(1): forbearance of an invalid claim IS consideration only if (a) the claim is genuinely doubtful as to facts or law, or (b) the forbearing party honestly believes it may fairly be determined valid. N flunks both \u2014 this is the Military College v. Brooks line between settlement and extortion.",why:"Flip the facts: an honestly held, uncertain claim dropped in exchange for payment WOULD be consideration."},{id:"c-hypo-subbid",type:"mcq",concept:"Reliance option \u2014 Restatement \xA7 87(2)",scenario:"A subcontractor submits a bid to a general contractor, who uses it (as the sub expects) in computing the winning master bid. Before the GC can formally accept, the sub revokes, citing a pricing error. Can the GC hold the sub to the bid?",options:["No \u2014 an offer is freely revocable any time before acceptance","Yes \u2014 the bid is binding as an option contract to the extent necessary to prevent injustice, because it foreseeably induced substantial reliance before acceptance","No \u2014 the GC never paid consideration to hold the bid open","Yes \u2014 subcontractor bids are irrevocable by statute"],correct:1,explanation:"Restatement \xA7 87(2) (in your outline under Dickinson): an offer the offeror should reasonably expect to induce action of a substantial character before acceptance, and which does, is binding as an option to the extent necessary to prevent injustice. The GC's reliance \u2014 building the bid into its own \u2014 substitutes for the consideration an option would normally require.",why:"The modern counterweight to Dickinson v. Dodds' hard rule that gratuitous hold-open promises don't bind."},{id:"c-hypo-option-mail",type:"mcq",concept:"Mailbox rule \u2014 option contract exception",scenario:"B pays S $500 for an option to buy S's lot, 'exercisable until June 1.' B mails a letter exercising the option May 30; it arrives June 2. Valid exercise?",options:["Yes \u2014 the mailbox rule makes the acceptance effective on dispatch, May 30","No \u2014 acceptance under an option contract is effective only upon RECEIPT, and it arrived after the deadline","Yes \u2014 options are construed in favor of the option holder","No \u2014 options can only be exercised in person"],correct:1,explanation:"The bracketed exception in \xA7 63 you outlined: the mailbox rule does NOT apply to option contracts. An option's acceptance must be RECEIVED within the option period \u2014 dispatch isn't enough. June 2 receipt misses a June 1 deadline; the option lapsed.",why:"The logic: the option holder already bought certainty; the offeror shouldn't bear mail-delay risk on top of it."},{id:"c-hypo-death",type:"mcq",concept:"Termination \u2014 death of the offeror",scenario:"S offers in writing to sell B a boat, 'offer open for two weeks.' One week in, S dies. B \u2014 unaware of the death \u2014 mails an acceptance within the two weeks. Contract?",options:["Yes \u2014 B accepted within the stated window without knowledge of the death","No \u2014 death of the offeror terminates the offer, even without notice to the offeree","Yes \u2014 the offer binds S's estate for the full two weeks","No \u2014 but only because boats require a signed writing"],correct:1,explanation:"The fifth termination method: death of the offeror means the death of the offer \u2014 knowledge is irrelevant, because there is no longer a mind to meet. (Distinguish a paid-for OPTION, which can survive death and bind the estate.)",why:"Compare Mellish's analogy in Dickinson: accepting after learning the property was sold is as impossible as accepting after the offeror dies."},{id:"c-hypo-request",type:"mcq",concept:"Conditional acceptance vs. mere request \u2014 \xA7 61",scenario:"Responding to an offer to sell a house, buyer writes: 'I accept your offer and enclose the signed agreement and deposit. Also \u2014 would you consider leaving the patio furniture? Either way, we are moving forward.' Seller ignores it and sells elsewhere. Contract?",options:["No \u2014 mentioning the furniture made this a counteroffer under the mirror image rule","Yes \u2014 the acceptance was unequivocal; the furniture line was a mere request that the acceptance did not depend on","No \u2014 an acceptance must repeat the offer's terms verbatim","Yes \u2014 but only if the seller responds to the furniture question"],correct:1,explanation:"Restatement \xA7 61: an acceptance requesting a change isn't invalidated unless it's made to DEPEND on assent to the change. 'Either way, we are moving forward' is exactly the unconditional language Ardente's letter lacked \u2014 Ardente sought 'confirmation' the items were 'part of the transaction,' which read as a condition.",why:"Same fact family as Ardente, flipped by one sentence \u2014 the exam move is quoting the language that shows (un)conditionality."},{id:"c-hypo-subordinate",type:"mcq",concept:"Restitution is subordinate to contracts",scenario:"Homeowner signs a $5,000 written contract with a painter. The painter performs fully, then discovers comparable jobs go for $8,000 and sues in unjust enrichment for the $3,000 difference. Result?",options:["Painter recovers $3,000 \u2014 the homeowner was enriched by below-market work","Painter recovers nothing extra \u2014 restitution is subordinate to contracts; the valid contract fixes the recovery at its price","Painter recovers $8,000 in quantum meruit and forfeits the contract price","Painter recovers if he proves the homeowner knew the market rate"],correct:1,explanation:"Restitution is SUBORDINATE to contracts: where a valid contract governs the exact benefit conferred, unjust enrichment is unavailable to rewrite the bargain. The 'enrichment' has an adequate legal basis \u2014 the contract \u2014 so it isn't unjust(ified).",why:"The Restatement (Third)'s framing from your outline: restitution targets enrichment that LACKS an adequate legal basis."},{id:"c-hypo-mower",type:"mcq",concept:"Unjust enrichment \u2014 volunteer / forced exchange",scenario:"While a homeowner is on vacation, a landscaper mows the badly overgrown lawn uninvited, then bills $200 \u2014 genuinely improving the property's look. Must the homeowner pay?",options:["Yes \u2014 a real benefit was conferred and retained","No \u2014 an unrequested benefit voluntarily conferred creates no compensation obligation, and the homeowner can't be forced into a purchase she never chose","Yes \u2014 but only the fair market value of the mowing","No \u2014 unless the landscaper mows a second time"],correct:1,explanation:"Both element-two exceptions fire: the landscaper gratuitously chose to confer a benefit instead of contracting (volunteer), and the homeowner received unrequested services she wouldn't necessarily have bought at market value (forced exchange). Element one is satisfied \u2014 the lawn IS better \u2014 but retention isn't unjust.",why:"Same skeleton as the professor's lumberjack pattern \u2014 good deed, no debt."},{id:"c-hypo-quote",type:"mcq",concept:"Quotations \u2014 the Fairmount pattern",scenario:"Buyer emails: 'What is your best price on 500 units of part #77, delivered to Tampa?' Seller replies: 'Part #77: $4.00/unit delivered Tampa, for immediate acceptance, shipment by June 1.' Buyer replies: 'Accepted \u2014 500 units.' Seller refuses, calling its email 'just a quote.' Contract?",options:["No \u2014 price quotations are never offers (Moulton)","Yes \u2014 a quote answering a specific inquiry, with quantity supplied by the inquiry and 'for immediate acceptance' language, is an offer","No \u2014 the buyer's reply was the first offer, which the seller never accepted","Yes \u2014 all commercial emails are binding offers"],correct:1,explanation:"The Fairmount pattern: the seller's response wasn't a general circular (Moulton) \u2014 it answered a SPECIFIC inquiry that fixed the quantity, and 'for immediate acceptance' invited assent to conclude the deal. Labeling it a 'quote' doesn't control; the objective features do.",why:"The Moulton \u2192 Fairmount \u2192 Nordyne line in one hypo: context, specificity, and acceptance-inviting language flip a quote into an offer."}]},torts:{name:"Torts",cards:[{id:"t-intent",type:"cloze",concept:"Battery intent \u2014 Garratt v. Dailey",text:"Intent is satisfied by acting with the {{purpose}} of causing the contact, or with knowledge to a {{substantial}} {{certainty}} that the contact will result.",why:"Age and mental capacity go only to whether the actor COULD hold that knowledge \u2014 Garratt (age five), Wagner (mental disability). Neither status defeats intent by itself."},{id:"t-wagner",type:"flash",concept:"Capacity \u2014 Wagner v. State",prompt:"Does mental disability defeat the intent element of battery?",answer:["No. Battery requires only intent to make the contact \u2014","not intent to harm, and not understanding that the act is wrong.","A mentally disabled actor can form that intent."],fallback:"Only intent to {{contact}} is required \u2014 not intent to {{harm}}, and not understanding of wrongfulness.",why:"Pairs with Garratt: two kinds of incapacity, one intent standard."},{id:"t-fisher",type:"flash",concept:"Battery \u2014 Fisher v. Carrousel",prompt:"Is touching the plaintiff's body required for battery?",answer:["No. Contact with anything so closely identified with the body","as to be customarily regarded as part of the person (a plate in the hand) suffices.","Battery protects personal dignity, not just skin."],fallback:"Contact with an object closely {{identified}} with the body counts; battery protects personal {{dignity}}.",why:"Plate snatched from Fisher's hand \u2014 no skin contact, still battery."},{id:"t-assault",type:"flash",concept:"Assault \u2014 Western Union v. Hill",prompt:"Assault: actual ability or apparent ability to complete the contact?",answer:["Apparent ability is enough, judged from a reasonable person's view.","Actual ability to complete the touching is NOT required."],fallback:"{{apparent}} ability is enough; {{actual}} ability is not required.",why:"The counter may have physically stopped Sapp from reaching Mrs. Hill \u2014 irrelevant, because it reasonably appeared he could."},{id:"t-fi",type:"flash",concept:"False imprisonment \u2014 Big Town + Parvi",prompt:"False imprisonment: the rule, plus Parvi's refinement about awareness?",answer:["Direct restraint of another's physical liberty without adequate legal justification (Big Town).","The plaintiff must be conscious of the confinement AT THE TIME (or harmed by it) \u2014","but need not remember it later (Parvi)."],fallback:"Restraint of physical {{liberty}} without legal {{justification}}; the victim must be {{conscious}} of it at the time, or harmed by it.",why:"Parvi was drunk and remembered nothing \u2014 but memory later \u2260 awareness at the time. Jury question."},{id:"t-iied",type:"flash",concept:"IIED \u2014 Harris v. Jones",prompt:"IIED: the four elements?",answer:["1) Intentional or reckless conduct","2) Extreme and outrageous","3) Causal connection between conduct and distress","4) The emotional distress must be severe"],fallback:"1) {{intentional}} or reckless 2) {{extreme}} and outrageous 3) a {{causal}} connection 4) the distress must be {{severe}}.",why:"Harris proved the mocking but lost on element four \u2014 severity is a high bar, and vague evidence won't clear it."},{id:"t-transfer",type:"flash",concept:"Transferred intent \u2014 Talmage v. Smith",prompt:"Transferred intent: what transfers, and where does it stop?",answer:["Intent to commit a tort against A transfers when the act injures B instead.","Works among: battery, assault, false imprisonment, trespass to land, trespass to chattels.","Limit: it does NOT reach a bystander's IIED claim where the defendant didn't know the bystander was present (Taylor v. Vallelunga)."],fallback:"Intent aimed at {{A}} transfers to injured {{B}} \u2014 but not to an unknown {{bystander}}'s IIED claim.",why:"Talmage: stick thrown at one boy, hits another \u2014 liable. Taylor: daughter secretly watching her father's beating \u2014 no IIED without directed intent."},{id:"t-mcq-stick",type:"mcq",concept:"Transferred intent",scenario:"D throws a rock to scare trespasser A off his shed; it misses and blinds bystander B, whom D never saw. Battery against B?",options:["No \u2014 D had no intent toward B","Yes \u2014 transferred intent supplies the intent element","No \u2014 B assumed the risk by standing nearby","Yes \u2014 but only as negligence, not battery"],correct:1,explanation:"Talmage v. Smith: intent to commit unlawful contact against A transfers to B, the person actually struck. D can't escape liability because he hit the wrong target.",why:"You don't need intent toward the specific victim \u2014 just intent to commit the tort against someone."},{id:"t-mcq-crowd",type:"mcq",concept:"Offensive contact in context",scenario:"During a fire drill in a packed stairwell, a teacher taps a parent's back with her fingertips to get her attention over the alarm. The parent falls and sues for battery. Best analysis?",options:["Battery \u2014 any unconsented touch qualifies","No battery \u2014 ordinary contact in a crowded setting isn't offensive unless rude, insolent, or angry","No battery \u2014 school employees are immune","Battery \u2014 because injury resulted, intent is presumed"],correct:1,explanation:"Wallace v. Rosen: some contact is part of the ordinary give-and-take of crowded life. Offensiveness is judged by an ordinary person, not one unduly sensitive about dignity \u2014 and context (emergency, alarm, crowd) matters.",why:"Battery's 'offensive' element is contextual, not absolute."}]},civpro:{name:"Civil Procedure",cards:[{id:"cp-1332",type:"cloze",concept:"Diversity statute \u2014 28 U.S.C. \xA7 1332(a)",text:"The district courts have original jurisdiction where the matter in controversy exceeds {{$75,000}}, exclusive of {{interest}} and {{costs}}, and is between citizens of different {{states}}.",why:"The two pillars of diversity jurisdiction: complete diversity + amount in controversy. Both must be satisfied."},{id:"cp-complete-div",type:"cloze",concept:"Complete diversity",text:"Complete diversity requires that no {{plaintiff}} be a citizen of the same state as any {{defendant}}; shared citizenship on the {{same}} side of the v. is fine.",why:"\u03C0-NJ + \u03C0-NJ vs. \u0394-NY + \u0394-NY works. One NY plaintiff against one NY defendant kills it. A judge who notices the defect must dismiss sua sponte \u2014 no motion needed."},{id:"cp-domicile",type:"cloze",concept:"Citizenship \u2014 natural person",text:"A natural person is a citizen of the state of her domicile \u2014 her {{true}}, {{fixed}}, and {{permanent}} home. Every person has exactly {{one}} domicile, never more.",why:"A child takes the parents' domicile until majority/emancipation. A U.S. citizen domiciled abroad is 'stateless' \u2014 neither a state citizen nor an alien, so no diversity OR alienage jurisdiction (Friedrich v. Davis)."},{id:"cp-nerve",type:"cloze",concept:"Corporate PPB \u2014 Harrison v. Granite Bay",text:"A corporation's principal place of business is found by the {{nerve}} {{center}} test \u2014 the place where officers {{direct}}, control, and coordinate the corporation's activities.",why:"Where the decisions are made, not where operations happen. Granite Bay's group homes were in Maine, but its officers decided from Concord, NH \u2192 PPB = NH."},{id:"cp-caps",type:"flash",concept:"Exclusive federal SMJ \u2014 CAPS",prompt:"Which claims fall within EXCLUSIVE federal subject matter jurisdiction? (the mnemonic)",answer:["C \u2014 Copyright","A \u2014 Anti-trust","P \u2014 Patent infringement","S \u2014 Securities","Everything else a state court can hear."],fallback:"{{Copyright}}, {{Anti}}-trust, {{Patent}} infringement, {{Securities}} \u2014 'CAPS'.",why:"Most federal claims (e.g., Title VII) are CONCURRENT \u2014 either court system. CAPS claims are the narrow federal-only carve-out."},{id:"cp-gen-lim",type:"flash",concept:"General vs. limited SMJ",prompt:"Why are state courts called courts of GENERAL SMJ and federal courts courts of LIMITED SMJ?",answer:["State courts can hear nearly any claim \u2014 all state law claims, plus all federal claims except the exclusive (CAPS) set. Always available: the catch-all.","Federal courts hear only a limited subset \u2014 all federal law claims, but state law claims only when diversity requirements are met."],fallback:"State courts hear {{any}} claim outside exclusive SMJ; federal courts hear all {{federal}} claims but state claims only through {{diversity}}.",why:"Professor's 'default SMJ': there is always a state court for your claim even when federal court is closed to you."},{id:"cp-corp",type:"flash",concept:"Citizenship \u2014 corporation",prompt:"A corporation is a citizen of which state(s)?",answer:["1) Every state in which it is incorporated (can be more than one), AND","2) The one state of its principal place of business \u2014 found by the nerve center test.","BOTH citizenships count when testing complete diversity."],fallback:"Every state of {{incorporation}} plus the state of its principal place of {{business}} \u2014 located at its {{nerve}} center.",why:"The dual citizenship is the trap: a DE-incorporated corporation with a NY nerve center kills diversity against ANY New York opponent (professor's slide hypo)."},{id:"cp-members",type:"flash",concept:"Citizenship \u2014 partnership / LLC / union",prompt:"Partnerships, LLCs, and labor unions: citizens of which state(s)?",answer:["Every state in which ANY partner or member is a citizen.","One member in the wrong state destroys complete diversity.","Unlike corporations, there is no PPB rule here \u2014 membership is everything."],fallback:"Every state in which any {{partner}} or {{member}} is a citizen \u2014 no principal place of {{business}} rule applies.",why:"The classic exam trick is treating an LLC like a corporation. It isn't \u2014 an LLC with members in ten states is a citizen of all ten."},{id:"cp-legalrep",type:"flash",concept:"Citizenship \u2014 legal representative",prompt:"A legal representative (of a decedent, infant, or incompetent) is a citizen of which state?",answer:["The state of the REPRESENTED person \u2014 not the representative's own state.","\xA7 1332(c)(2): the representative is 'deemed' a citizen only of the represented person's state."],fallback:"The state of the {{represented}} person only \u2014 the representative's {{own}} citizenship is ignored.",why:"Professor's hypo: a Georgia executor for a Florida decedent is a citizen of FLORIDA for diversity purposes."},{id:"cp-timing",type:"flash",concept:"Timing of citizenship",prompt:"When is a party's citizenship determined \u2014 and which changes count?",answer:["At the moment the lawsuit is commenced.","Pre-commencement changes count, regardless of motive (can create or destroy diversity).","Post-commencement changes never count (cannot create or destroy diversity)."],fallback:"Citizenship is fixed at {{commencement}}; {{pre}}-commencement changes count regardless of motive; {{post}}-commencement changes never do.",why:"A defendant can't escape a judge it dislikes by relocating its PPB mid-case \u2014 and a plaintiff who genuinely moves before filing manufactures diversity legitimately (motive alone isn't disqualifying)."},{id:"cp-change-dom",type:"flash",concept:"Changing domicile \u2014 Ceglia v. Zuckerberg",prompt:"How does a natural person change domicile, and how do courts verify it?",answer:["1) Physical presence in the new state (crossing the line counts), AND","2) Intent to make it her true, fixed, permanent home.","Courts test intent with objective evidence: residence, real/personal property, bank accounts, voter registration, employment, driver's license, tax payments."],fallback:"{{physical}} presence in the new state plus {{intent}} to make it the true, fixed, permanent home \u2014 proven by {{objective}} evidence.",why:"Both prongs must coincide. Saying you've moved isn't enough; the paper trail decides (Ceglia)."},{id:"cp-stateless",type:"flash",concept:"Stateless citizen \u2014 Friedrich v. Davis",prompt:"A U.S. citizen domiciled abroad is a party. Diversity? Alienage?",answer:["Neither. A U.S. citizen domiciled abroad is not a citizen of any state (no state domicile) \u2014 and is not an alien (still a U.S. citizen).","'Stateless' \u2014 their presence defeats both diversity AND alienage jurisdiction."],fallback:"A U.S. citizen domiciled {{abroad}} is not a citizen of a state nor an {{alien}} \u2014 '{{stateless}}' \u2014 so there can be neither diversity nor alienage jurisdiction.",why:"Friedrich v. Davis. A stateless party fits no \xA7 1332 category, so the whole configuration fails."},{id:"cp-evidence",type:"flash",concept:"Objective evidence of domicile \u2014 Ceglia",prompt:"Courts test a claimed domicile change with objective evidence. Name at least five kinds.",answer:["Physical residence \xB7 personal and real property \xB7 bank and brokerage accounts \xB7 voter registration \xB7 employment \xB7 driver's license and auto registration \xB7 payment of taxes."],fallback:"Physical {{residence}}, real and personal {{property}}, bank and brokerage accounts, {{voter}} registration, employment, driver's {{license}} and auto registration, and payment of {{taxes}}.",why:"Ceglia v. Zuckerberg \u2014 the paper trail decides intent, not the party's say-so."},{id:"cp-aic-test",type:"flash",concept:"AIC \u2014 good faith & legal certainty",prompt:"The amount in controversy standard: whose number controls, and what's the test?",answer:["Must EXCEED $75,000, exclusive of interest and costs.","The plaintiff's good-faith allegation controls \u2014 unless it appears to a legal certainty the amount cannot be recovered.","Recovering less than $75,000 later does NOT defeat jurisdiction (AIC is measured at commencement).","Exam rule for injunctions: satisfied if EITHER side's valuation exceeds $75,000."],fallback:"Plaintiff's {{good}}-faith allegation controls unless it appears to a legal {{certainty}} the amount cannot be recovered; recovery below the minimum {{after}} commencement does not defeat jurisdiction.",why:"$75,000.00 exactly fails \u2014 it must exceed. Punitive damages can carry a claim over the line."},{id:"cp-aic-counts",type:"flash",concept:"AIC \u2014 what counts",prompt:"For the AIC: which of these count \u2014 pre-filing interest, post-filing interest, court costs, attorney fees, mitigated wages?",answer:["Pre-filing interest: counts. Post-filing interest: does not.","Costs (filing fees, court reporters, experts): do not count.","Attorney fees: count only if recoverable under an exception to the American Rule.","Mitigation subtracts: pre-commencement earnings from a new job reduce a lost-wages claim (Bush v. Roadway)."],fallback:"{{pre}}-filing interest counts; post-filing interest and {{costs}} do not; attorney fees count only under an exception to the {{American}} Rule; {{mitigation}} reduces the claim.",why:"Bush also teaches burden: the party invoking federal jurisdiction (there, the removing defendant) must prove the AIC when questioned \u2014 and Roadway wouldn't put a number on Bush's other damages for fear of setting a floor for trial."},{id:"cp-alienage",type:"flash",concept:"Alienage jurisdiction",prompt:"Alienage: which configurations work, and which never do?",answer:["Alien vs. U.S. citizen domiciled in a state: works (either side).","LPRA vs. U.S. citizen: works \u2014 UNLESS the LPRA is domiciled in the same state as the opposing citizen.","Alien vs. alien: NEVER \u2014 even two LPRAs domiciled in different states.","Extra alien parties don't destroy jurisdiction so long as a fully diverse citizen pairing anchors the suit \u2014 but \u03C0(MEX) vs. \u0394(MEX) + \u0394(FL) fails until the foreign defendant is dropped."],fallback:"An alien vs. a {{citizen}} of a state = alienage jurisdiction; two {{aliens}} on opposite sides = never; an LPRA domiciled in the {{same}} state as the opposing citizen destroys it.",why:"\xA7 1332(a)(2): the LPRA same-state carve-out is statutory, not judge-made. And a U.S. citizen domiciled abroad fits nowhere \u2014 stateless (Friedrich)."},{id:"cp-exceptions",type:"flash",concept:"Exceptions to diversity jurisdiction",prompt:"The three exceptions to diversity jurisdiction \u2014 and the exam-flagged carve-out?",answer:["Collusive joinder: courts ignore artificial claim assignments made solely to manufacture diversity (genuine unilateral moves are fine \u2014 motive alone isn't disqualifying).","Domestic relations: divorce, alimony/support awards or modifications, and custody decrees ONLY \u2014 but a collection action for UNPAID support is NOT excluded. [Exam point]","Probate: federal courts won't administer an estate or will directly \u2014 but CAN hear related tort/misconduct claims against administrators."],fallback:"The domestic relations exception covers {{divorce}}, support, and {{custody}} decrees \u2014 but does NOT bar {{collection}} actions for unpaid support; courts also disregard {{collusive}} joinder.",why:"The professor flagged the unpaid-support collection carve-out specifically for the exam."},{id:"cp-realign",type:"flash",concept:"Realignment",prompt:"What is realignment, and why does it matter for diversity?",answer:["The court may realign parties according to their ACTUAL interests, regardless of how the complaint labels them.","Realignment can create or destroy complete diversity."],fallback:"The court aligns parties by their actual {{interests}}, not their labels \u2014 which can {{create}} or destroy diversity.",why:"Labels don't control; substance does. A 'defendant' whose interests track the plaintiff's gets moved across the v."},{id:"cp-mcq-agg1",type:"mcq",concept:"Aggregation \u2014 Rule 1",scenario:"\u03C0 (NJ) sues \u0394 (NY) in one lawsuit: negligence for $50,000 and breach of contract for $60,000. Is the amount in controversy satisfied?",options:["No \u2014 each claim must independently exceed $75,000","Yes \u2014 one plaintiff may aggregate all her claims against one defendant: $110,000","No \u2014 tort and contract claims can never be combined","Yes \u2014 but only because the claims arise from the same transaction"],correct:1,explanation:"Aggregation Rule 1: a single plaintiff adds together ALL her claims against a single defendant \u2014 related or not. $50k + $60k = $110k, AIC satisfied.",why:"One-on-one is the only free aggregation. Add a party on either side and the rules flip."},{id:"cp-mcq-agg2",type:"mcq",concept:"Aggregation \u2014 Rules 2 & 3",scenario:"\u03C0 (NJ) sues \u0394-1 (NY) for negligence ($50,000) and \u0394-2 (PA) for negligence ($60,000) in one lawsuit. AIC satisfied?",options:["Yes \u2014 the total at stake is $110,000","No \u2014 one plaintiff cannot aggregate claims against multiple defendants; neither claim clears $75,000","Yes \u2014 as long as complete diversity exists","No \u2014 negligence claims are capped at $75,000"],correct:1,explanation:"Aggregation Rule 2: no adding across defendants. Each defendant's exposure is measured separately, and neither $50k nor $60k exceeds $75k. (Rule 3 is the mirror: multiple plaintiffs can't combine against one defendant.)",why:"Exception: a JOINT claim (joint tortfeasors, jointly held rights) counts as one claim for its full value."},{id:"cp-mcq-jsl",type:"mcq",concept:"AIC \u2014 joint & several liability",scenario:"Polly (FL) sues Daniel (GA) and Donald (SC) \u2014 jointly and severally liable \u2014 for $100,000 in one negligence action. Can she satisfy the AIC in federal court?",options:["No \u2014 $100,000 split across two defendants is $50,000 each","Yes \u2014 under joint and several liability, the claim against EACH defendant is for the full $100,000","No \u2014 multiple defendants always defeat the AIC","Yes \u2014 but only if each defendant's share independently exceeds $75,000"],correct:1,explanation:"Joint and several liability means Polly can collect the entire $100,000 from either defendant alone \u2014 so the amount in controversy against each is $100,000, even though she can only collect $100,000 in total.",why:"Joint claims are the carve-out from the no-aggregation rules: one claim, full value."},{id:"cp-mcq-timing",type:"mcq",concept:"Post-commencement citizenship change",scenario:"ABC (DE + NY) sues DEF (CA + PPB Los Angeles) in federal court. Mid-case, after unfavorable rulings, DEF moves its principal place of business to New York and moves to dismiss for lack of complete diversity. Result?",options:["Grant \u2014 complete diversity no longer exists","Deny \u2014 citizenship is fixed at commencement; post-commencement changes cannot destroy diversity","Grant \u2014 a corporation's citizenship follows its current PPB","Deny \u2014 but only because DEF's motive was improper"],correct:1,explanation:"Citizenship is measured when the suit is commenced (DE+NY vs. CA). Post-commencement changes never create or destroy diversity \u2014 motive is irrelevant, timing is everything.",why:"Flip side: a genuine pre-commencement move counts even if made precisely to create diversity."},{id:"cp-mcq-injunction",type:"mcq",concept:"AIC \u2014 valuing an injunction",scenario:"Peter (NY) seeks an injunction forcing Danielle (CT) to lower her beach house. Success raises Peter's home value by $50,000; compliance costs Danielle $250,000. For exam purposes, is the AIC satisfied?",options:["No \u2014 the plaintiff's viewpoint controls, and $50,000 falls short","Yes \u2014 the AIC is satisfied if EITHER party's valuation exceeds $75,000","No \u2014 injunctions have no monetary value for AIC purposes","Yes \u2014 injunction cases are exempt from the AIC requirement"],correct:1,explanation:"Courts split on valuing injunctions, but the exam rule per the professor: the AIC is satisfied when the value from EITHER the plaintiff's or the defendant's perspective exceeds $75,000. Danielle's $250,000 compliance cost carries it.",why:"Know both views exist; apply the either-viewpoint rule on the exam."},{id:"cp-mcq-alien",type:"mcq",concept:"Alienage \u2014 alien on both sides",scenario:"\u03C0 (citizen of Mexico) sues \u0394-1 (citizen of Mexico) and \u0394-2 (U.S. citizen, FL) on a state law claim for $200,000. Alienage jurisdiction?",options:["Yes \u2014 an alien versus a U.S. citizen always supports alienage jurisdiction","No \u2014 aliens appear on both sides of the v.; but dropping the Mexican defendant would cure it","Yes \u2014 additional foreign parties never affect jurisdiction","No \u2014 alienage jurisdiction requires all parties to be U.S. citizens"],correct:1,explanation:"Alienage never exists between two aliens \u2014 and here aliens sit on both sides. Extra alien parties are tolerated only when a fully diverse pairing anchors the suit. Drop \u0394-1, and \u03C0(MEX) vs. \u0394(FL) is a clean \xA7 1332(a)(2) case.",why:"Check every party's status before calling it alienage \u2014 one alien opposite another poisons the configuration."},{id:"cp-mcq-caps",type:"mcq",concept:"Exclusive SMJ \u2014 professor's Sherman Act hypo",scenario:"Polly (FL) sues Daniel (FL) for violating the Sherman Act, 15 U.S.C. \xA7 1 (federal antitrust). Where can this claim be heard?",options:["State court only \u2014 the parties aren't diverse","Federal court only \u2014 antitrust falls within exclusive federal SMJ (CAPS)","Either court \u2014 most federal claims are concurrent","Neither court \u2014 no diversity and no AIC alleged"],correct:1,explanation:"Antitrust is the A in CAPS \u2014 one of the few claims exclusively vested in federal courts. Diversity is irrelevant: this is federal question territory, and same-state parties don't matter.",why:"Spot the exclusive-SMJ claims first; diversity analysis never even starts for CAPS claims."},{id:"cp-mcq-concurrent",type:"mcq",concept:"Concurrent SMJ \u2014 professor's Title VII hypo",scenario:"Polly (FL) sues Daniel (FL) and ABC Corp under Title VII of the Civil Rights Act (federal law). Which court(s) can hear it?",options:["Federal only \u2014 all federal claims are exclusively federal","Either \u2014 most federal law claims fall within the concurrent jurisdiction of both systems","State only \u2014 the parties share Florida citizenship","Neither \u2014 employment claims must go to an agency first"],correct:1,explanation:"Title VII is a federal claim, but NOT a CAPS claim \u2014 so it's concurrent: a state court (general SMJ) or a federal court (federal question) can hear it. Shared FL citizenship blocks diversity, but federal question jurisdiction doesn't need diversity.",why:"Exclusive is the narrow exception; concurrent is the norm for federal claims."},{id:"cp-mcq-default",type:"mcq",concept:"Default SMJ \u2014 professor's $50k hypo",scenario:"Polly (FL) wants to sue Daniel (FL) for negligence, seeking $50,000. Which court(s) can hear the claim?",options:["Either \u2014 negligence claims are concurrent","State court only \u2014 same-state parties AND an amount under $75,000.01 each independently defeat diversity","Federal court only \u2014 car accidents involve federal highways","State court only \u2014 but solely because of the dollar amount"],correct:1,explanation:"This is the professor's 'default SMJ' scenario: a state law claim that CANNOT enter federal court because diversity fails twice over \u2014 no diverse citizenship and no sufficient AIC. State court is the catch-all that always remains.",why:"Either defect alone kills diversity; here there are two."},{id:"cp-mcq-corpdiv",type:"mcq",concept:"Complete diversity \u2014 corporate plaintiff",scenario:"\u03C0-1 (a corporation incorporated in DE with its PPB in NY), \u03C0-2 (NJ), \u03C0-3 (AL) sue \u0394-1 (NY), \u0394-2 (NY), \u0394-3 (TX). Complete diversity?",options:["Yes \u2014 \u03C0-1 is a Delaware corporation, and no other plaintiff overlaps","No \u2014 \u03C0-1 is ALSO a citizen of NY (its PPB), overlapping with \u0394-1 and \u0394-2","Yes \u2014 corporate citizenship is only tested where incorporated","No \u2014 multiple defendants from the same state defeat diversity by themselves"],correct:1,explanation:"Both corporate citizenships count. \u03C0-1 is a citizen of DE AND NY \u2014 and NY defendants sit across the v. Complete diversity fails. (Same-side overlaps, like the two NY defendants, are always fine.)",why:"Straight from the professor's Class One slides \u2014 always run the corporation's second citizenship."},{id:"cp-mcq-suasponte",type:"mcq",concept:"Sua sponte dismissal",scenario:"Peter (NY) sues Danielle (NY) in federal court on a $200,000 state law contract claim. Neither party objects to jurisdiction, but the judge notices the shared citizenship. What must the judge do?",options:["Nothing \u2014 objections to jurisdiction are waived if not raised","Dismiss for lack of SMJ, even without any motion \u2014 federal judges must police their own jurisdiction","Transfer the case to state court automatically","Proceed, but flag the issue for appeal"],correct:1,explanation:"The Constitution and \xA7 1332 limit federal SMJ, so federal judges are obligated to police it themselves. A judge who notices the defect must dismiss sua sponte \u2014 party silence can't create jurisdiction that doesn't exist.",why:"SMJ can never be waived, stipulated, or consented into existence."},{id:"cp-mcq-verdict",type:"mcq",concept:"AIC \u2014 measured at commencement",scenario:"Peter (NY) sues Danielle (CT) in federal court alleging $200,000 in contract damages. The jury awards only $25,000. Danielle immediately moves to dismiss for lack of SMJ. Result?",options:["Grant \u2014 the recovery proves less than $75,000 was ever in controversy","Deny \u2014 AIC is measured at commencement from the plaintiff's good-faith allegation; a smaller verdict changes nothing","Grant \u2014 but Peter keeps the $25,000","Deny \u2014 but only because Danielle waited until after trial"],correct:1,explanation:"The AIC is fixed at the moment of filing, based on a good-faith allegation. Recovering less later \u2014 even far less \u2014 does not retroactively strip jurisdiction. The legal-certainty test is applied looking forward from filing, not backward from the verdict.",why:"Timing symmetry with citizenship: both jurisdiction inputs lock at commencement."},{id:"cp-hypo-llc",type:"mcq",concept:"LLC vs. corporation citizenship trap",scenario:"An LLC with two members (one domiciled in FL, one in GA) sues a corporation incorporated in DE with its nerve center in FL, for $500,000. Complete diversity?",options:["Yes \u2014 the LLC is a citizen of its state of organization only","No \u2014 the LLC is a citizen of FL and GA (every member), the corporation of DE and FL \u2014 Florida sits on both sides","Yes \u2014 LLCs take only their principal place of business","No \u2014 LLCs can never invoke diversity jurisdiction"],correct:1,explanation:"The classic trap: an LLC takes EVERY member's citizenship (no PPB rule), while a corporation takes incorporation + nerve center. FL appears on both sides of the v. \u2014 complete diversity fails.",why:"Run entity citizenship rules separately for each side before comparing; never treat an LLC like a corporation."},{id:"cp-hypo-exec",type:"mcq",concept:"Legal representative citizenship",scenario:"A Georgia resident serving as executor of a Florida decedent's estate sues a Florida defendant in federal court for $200,000. Diversity?",options:["Yes \u2014 the executor is a Georgia citizen suing a Florida citizen","No \u2014 under \xA7 1332(c)(2), the executor is deemed a citizen only of Florida (the decedent's state), so both sides are Floridian","Yes \u2014 estates are citizens of every state where estate property sits","No \u2014 estates can never sue in federal court"],correct:1,explanation:"\xA7 1332(c)(2): a legal representative takes ONLY the represented person's citizenship \u2014 the executor's own Georgia domicile is ignored. FL vs. FL, no diversity. This is the professor's exact hypo with the parties put in suit posture.",why:"Also blocks manufacturing diversity by hand-picking an out-of-state representative."},{id:"cp-hypo-stateless",type:"mcq",concept:"Stateless member poisons the entity",scenario:"A partnership's three partners are domiciled in TX, OK \u2014 and one is a U.S. citizen domiciled in Paris. The partnership sues a NY corporation for $1M in federal court. Diversity?",options:["Yes \u2014 TX/OK vs. NY is completely diverse; ignore the partner abroad","No \u2014 the U.S.-citizen partner domiciled abroad is stateless, and the partnership takes every partner's status \u2014 no diversity configuration is possible","Yes \u2014 the Paris partner counts as a French citizen, creating alienage","No \u2014 partnerships cannot sue in federal court"],correct:1,explanation:"Chain two rules: a U.S. citizen domiciled abroad is stateless (Friedrich) \u2014 neither a state citizen nor an alien \u2014 and a partnership carries EVERY partner's citizenship. One stateless partner makes the entity un-diverse against anyone; the suit belongs in state court.",why:"Friedrich + the member rule stacked \u2014 exactly the kind of two-rule chain essay exams reward."},{id:"cp-hypo-lpra",type:"mcq",concept:"Alienage \u2014 the LPRA carve-out",scenario:"A citizen of Brazil, lawfully admitted for permanent residence (green card) and domiciled in Florida, sues a U.S. citizen domiciled in Florida for $100,000. Alienage jurisdiction?",options:["Yes \u2014 an alien versus a U.S. citizen is the core alienage case","No \u2014 \xA7 1332(a)(2)'s carve-out: no jurisdiction between a foreign citizen admitted for permanent residence and a U.S. citizen domiciled in the SAME state","Yes \u2014 green card holders are treated as U.S. citizens","No \u2014 Brazilians cannot sue in U.S. courts"],correct:1,explanation:"The statutory exception written into \xA7 1332(a)(2): an LPRA domiciled in the same U.S. state as the opposing citizen destroys alienage jurisdiction. Move either party's domicile to Georgia and the suit works.",why:"The carve-out is statutory text, not case law \u2014 quote it as such."},{id:"cp-hypo-move",type:"mcq",concept:"Pre-commencement move made to create diversity",scenario:"Three weeks before filing against a Texas defendant, P moves from Texas to Oklahoma specifically so she can sue in federal court \u2014 new apartment, new job, OK driver's license, voter registration, bank accounts. She then files. Does diversity exist?",options:["No \u2014 a move motivated by creating diversity is collusive and ignored","Yes \u2014 a GENUINE pre-commencement domicile change counts regardless of motive; the objective evidence shows real intent to remain","No \u2014 she must live in Oklahoma at least one year first","Yes \u2014 but only if the defendant consents"],correct:1,explanation:"Two rules cooperating: citizenship is fixed at commencement, and pre-commencement changes count REGARDLESS of reason \u2014 motive alone is not dis
