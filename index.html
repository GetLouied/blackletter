qualifying (that's the collusive-joinder doctrine's own limit; it targets artificial claim ASSIGNMENTS, not genuine unilateral moves). The Ceglia-style objective evidence proves the change is real.",why:"Distinguish: assigning a claim to an out-of-state strawman = collusive; actually moving your life = allowed."},{id:"cp-hypo-nerve",type:"mcq",concept:"Nerve center vs. operations",scenario:"A corporation runs all its factories in Ohio, where 95% of employees work \u2014 but its officers set policy and direct operations from a small headquarters in New York. Incorporated in Delaware. Its citizenships?",options:["DE and OH \u2014 the principal place of business is where the business mostly happens","DE and NY \u2014 the nerve center test locates the PPB where officers direct, control, and coordinate, not where operations occur","OH only \u2014 most employees controls","DE, OH, and NY \u2014 corporations take every state where they operate"],correct:1,explanation:"Harrison v. Granite Bay: the nerve center is the place of direction and decision \u2014 the brain, not the muscle. Heavy operations in Ohio don't move the PPB from the New York headquarters. Exactly one PPB, plus every state of incorporation.",why:"Watch for facts that dangle a big-operations state as bait \u2014 the test asks where decisions are made."},{id:"cp-hypo-support",type:"mcq",concept:"Domestic relations \u2014 the collection carve-out",scenario:"After a state-court divorce, P (now domiciled in GA) sues her ex-spouse (FL) in federal court to COLLECT $150,000 in unpaid, already-awarded child support. The ex moves to dismiss under the domestic relations exception. Result?",options:["Dismiss \u2014 anything touching child support is a domestic relations matter","Deny \u2014 the exception covers only issuing/modifying divorce, alimony, and custody decrees; a collection action for unpaid support proceeds in diversity","Dismiss \u2014 family members can never be diverse","Deny \u2014 but only if the state court certifies the question"],correct:1,explanation:"The exam-flagged carve-out: the domestic relations exception is narrow \u2014 divorce, alimony, and custody DECREES. A suit to collect a support debt already reduced to an award is an ordinary money claim; with GA vs. FL and $150,000, diversity is satisfied.",why:"Your outline literally tags this '[know for exam]' \u2014 the trap answer is over-reading the exception."},{id:"cp-hypo-interest",type:"mcq",concept:"AIC \u2014 interest and costs arithmetic",scenario:"P sues a diverse defendant alleging $70,000 in contract damages, plus $6,000 in interest that accrued BEFORE filing, and expects $10,000 in filing fees and expert costs. Amount in controversy satisfied?",options:["No \u2014 $70,000 in damages falls short and nothing else ever counts","Yes \u2014 pre-filing interest counts toward the AIC: $70,000 + $6,000 = $76,000, exceeding $75,000 (costs never count)","Yes \u2014 $70,000 + $10,000 in costs = $80,000","No \u2014 interest of any kind is excluded by the statute"],correct:1,explanation:"The professor's split on 'exclusive of interest and costs': PRE-filing interest (part of the accrued claim) counts; post-filing interest and litigation costs (filing fees, court reporters, experts) never do. $76,000 exceeds \u2014 not merely equals \u2014 $75,000. AIC satisfied.",why:"Attorney fees are the third wrinkle: they count only when recoverable under an exception to the American Rule."}]}},Jo={contracts:[{id:"b-c-sources",topic:"Sources of contract law",components:["Common law \u2014 judge-made, governs services","Restatement (Second) of Contracts as the common-law guide","UCC Article 2 \u2014 statutory, governs transactions in goods","Threshold question: goods or services?"],model:["Common law \u2014 judge-made, applies to services, organized for study by the Restatement (Second) of Contracts. UCC Article 2 \u2014 statutory, applies to transactions in goods.","Characterize the subject matter first; the rules diverge (notably on the mirror image rule)."]},{id:"b-c-objective",topic:"Objective theory of contracts",components:["Outward expression controls, not secret unexpressed intention","Law imputes an intention matching the reasonable meaning of words and acts","A private joke or reservation does not defeat a manifested agreement","Unless a reasonable person would have recognized the joke"],model:["We look to the outward expression of a person as manifesting his intention rather than to his secret and unexpressed intention; the law imputes an intention corresponding to the reasonable meaning of his words and acts (Lucy v. Zehmer).","A private reservation \u2014 drunk, joking \u2014 does not defeat what the conduct manifested, unless a reasonable person in the other party's position would have understood it as a joke (contrast Leonard)."]},{id:"b-c-formation",topic:"Contract formation ingredients",components:["Offer \u2014 one party offers a promise","Acceptance \u2014 the other party accepts","Offer + acceptance = meeting of the minds","Consideration \u2014 bargained-for exchange"],model:["Three ingredients: offer, acceptance (together the meeting of the minds), and consideration \u2014 a bargained-for exchange.","Where one is missing, the workarounds are promissory estoppel and restitution."]},{id:"b-c-offer",topic:"Offer \u2014 definition",components:["\xA7 24 \u2014 manifestation of willingness to enter into a bargain","So made as to justify another in understanding assent is invited","\u2026and that assent will conclude it","\xA7 26 \u2014 no offer if a further manifestation of assent is required","Test: would 'I accept' create mutually binding obligations?"],model:["Rest. \xA7 24: an offer is the manifestation of willingness to enter into a bargain, so made as to justify another person in understanding that their assent to that bargain is invited and will conclude it.","Rest. \xA7 26 negative: no offer where the addressee knows or has reason to know the maker does not intend to conclude a bargain until making a further manifestation of assent.","Working test: if 'I accept' would create mutually binding obligations, it is probably an offer."]},{id:"b-c-offerfactors",topic:"Offer \u2014 the eight factors",components:["Finality","Completeness","Context","Audience","Jargon","Method of acceptance","Public policy / fairness","Accepted practice","None is dispositive"],model:["Finality (willing to be bound on acceptance); completeness (substantially all contemplated terms); context (indicating hope for acceptance); audience (broad audience cuts against); jargon ('legally binding offer' language); method of acceptance specified; public policy and fairness (exploiting an ambiguity cuts against); accepted practice or course of dealing.","None of these is necessarily dispositive \u2014 they are weighed, not counted."]},{id:"b-c-quotes",topic:"Price quotations \u2014 the rule",components:["General rule \u2014 a quotation invites offers, it is not one","Becomes an offer if assent alone would conclude the deal","Factor \u2014 extent of prior inquiry","Factor \u2014 completeness of terms","Factor \u2014 number of recipients"],model:["A price quotation is generally not an offer but a suggestion to induce offers. It becomes one if detailed enough that it reasonably appears assent to the quote is all that is needed to ripen it into a contract.","Rest. \xA7 26 cmt. c factors: the extent of prior inquiry, the completeness of the terms, and the number of persons to whom it was communicated."]},{id:"b-c-quotecases",topic:"Quotation cases compared",components:["Moulton \u2014 unsolicited general circular, no quantity limit, not an offer","Fairmount \u2014 answered a specific inquiry, 'for immediate acceptance' \u2014 offer","Nordyne \u2014 months of negotiation, complete terms, one recipient, custom product \u2014 offer","The variable is specificity plus acceptance-inviting language"],model:["Moulton v. Kershaw: an unsolicited general trade letter ('we are authorized to offer') with no quantity limit is a solicitation, not an offer.","Fairmount Glass Works: a quote responding to a specific inquiry, with quantity fixed by that inquiry and 'for immediate acceptance,' is an offer.","Nordyne v. ICM: a negotiated, complete, single-recipient quotation for a custom product is an offer, accepted by the production sign-off."]},{id:"b-c-ads",topic:"Advertisements \u2014 the rule",components:["Default \u2014 an ad invites offers, it is not one (Craft)","Q1 \u2014 performance promised in positive terms for something requested","Q2 \u2014 clear, definite, explicit, nothing open to negotiation","Q3 \u2014 other facts showing intent to be bound"],model:["Absent special circumstances, an advertisement is a mere invitation for the audience to make offers (Craft v. Elder & Johnston).","Three questions: was performance promised in positive terms in return for something requested; is it clear, definite, and explicit, leaving nothing open for negotiation; and do other facts show the advertiser intended an offer."]},{id:"b-c-lefkowitz",topic:"Lefkowitz v. Great Minneapolis Surplus",components:["Ad was clear, definite, explicit \u2014 nothing open to negotiation","'First come, first served' identified who could accept","Performance (being first, $1 in hand) was the acceptance","A limiting mechanism caps acceptances at inventory","House rules cannot be imposed after acceptance"],model:["'Saturday 9 A.M. Sharp \u2026 1 Black Lapin Stole \u2026 $1.00 First Come First Served' was clear, definite, and explicit, leaving nothing open for negotiation \u2014 so it was an offer, accepted by the plaintiff's performance in arriving first with the price.","The limiting language also caps acceptances at inventory. An advertiser may modify before acceptance but may not impose new conditions (the 'women only' house rule) afterward."]},{id:"b-c-leonard",topic:"Leonard v. PepsiCo",components:["Commercial deferred all terms to a separate catalog","No limiting words \u2014 nothing capped the acceptances","Objective reasonable viewer would perceive a joke","The viewer's order form was itself the offer, never accepted"],model:["The Harrier Jet commercial was not an offer: it was not self-contained (redemption terms lived in the separate catalog), it lacked any 'first come, first served'-type limitation, and no objective, reasonable person would have understood it as serious.","Under the ordinary rule, Leonard's order form and check constituted the offer \u2014 which PepsiCo never accepted."]},{id:"b-c-accept",topic:"Acceptance \u2014 definition and mode",components:["\xA7 50 \u2014 manifestation of assent in a manner invited or required","By default, any reasonable manner is invited","By promise \u2014 every act essential to making the promise","By performance \u2014 at least part performed or tendered","Ambiguous offer \u2014 either mode works"],model:["Rest. \xA7 50: acceptance is the manifestation of assent to the terms of the offer, made by the offeree in a manner invited or required by the offer. By default an offer invites acceptance in any reasonable manner.","Acceptance by promise requires every act essential to making the promise; acceptance by performance requires at least part of the requested performance to be performed or tendered \u2014 mere preparation is insufficient. If the offer is ambiguous, either mode works."]},{id:"b-c-mirror",topic:"Mirror image rule",components:["An acceptance changing a material term is a counteroffer","A counteroffer operates as a rejection","\xA7 59 \u2014 conditional on assent to different/additional terms = counteroffer","\xA7 61 \u2014 a mere request for change does not invalidate","\u2026unless the acceptance is made to DEPEND on that change"],model:["An acceptance that attempts to change a material term of the offer is a counteroffer, not an acceptance, and a counteroffer operates as a rejection.","Rest. \xA7 59: a reply purporting to accept but conditional on the offeror's assent to additional or different terms is a counter-offer. Rest. \xA7 61: an acceptance that requests a change or addition is not invalidated unless the acceptance is made to depend on assent to it."]},{id:"b-c-ardente",topic:"Ardente v. Horan",components:["Buyer signed and returned the agreement with a deposit","Letter sought 'confirmation' the furnishings were 'part of the transaction'","\u2026and stressed the items would be difficult to replace","Read as a condition, not a collateral request \u2192 counteroffer, no contract"],model:["The plaintiff executed the purchase agreement and enclosed a deposit, but the accompanying letter asked the sellers to confirm that listed furnishings were part of the transaction and stressed they would be difficult to replace.","Because the letter did not unequivocally state he would proceed either way, it imposed a condition rather than making a collateral request \u2014 converting the acceptance into a counteroffer, so no contract formed."]},{id:"b-c-notice",topic:"Notice of acceptance",components:["No contract until acceptance is communicated to the offeror","An uncommunicated intention to accept is not an acceptance","Where the offer calls for a promise, notice is always essential","Notice to an agent within authority is notice to the principal"],model:["There is no contract until acceptance is communicated to the offeror; an uncommunicated intention to accept is not an acceptance, and a mere private act of the offeree does not suffice. Where the offer calls for a promise rather than an act, notice of acceptance is always essential (Hendricks v. Behee).","Notice to an agent, within the scope of the agent's authority, is notice to the principal \u2014 which is why revocation delivered to the sellers' agent beat their signed but uncommunicated acceptance."]},{id:"b-c-mailbox",topic:"Mailbox rule \u2014 the basic rule",components:["\xA7 63(a) \u2014 acceptance operative when put out of the offeree's control","Unless the offer provides otherwise","Effective even if it never reaches the offeror","Morrison v. Thoelke \u2014 complete on mailing, barring later repudiation"],model:["Rest. \xA7 63(a): unless the offer provides otherwise, an acceptance made in a manner and by a medium invited by the offer is operative and completes the manifestation of mutual assent as soon as it is put out of the offeree's control, without regard to whether it ever reaches the offeror.","Morrison v. Thoelke: the contract is complete on mailing, which bars repudiation before delivery."]},{id:"b-c-mailbox2",topic:"Mailbox rule \u2014 receipt and overtaking",components:["Dispatch timing applies ONLY to first-move acceptances","Revocations are effective on receipt","Rejections are effective on receipt","An acceptance sent after a rejection is only a counteroffer unless it arrives first","Option contracts excepted \u2014 exercise effective on receipt"],model:["The dispatch rule applies only to first-move acceptances. Revocations, rejections, and second-move acceptances are effective only upon actual receipt.","Overtaking: a mailed rejection does not terminate the power of acceptance until received, but an acceptance dispatched after a rejection is only a counteroffer unless it reaches the offeror before the rejection does.","Options are excepted \u2014 an exercise must be received within the option period."]},{id:"b-c-term",topic:"Termination of the offer \u2014 five ways",components:["Rejection","Revocation at any time before acceptance","Counteroffer (a conditional acceptance can be one)","Lapse of time \u2014 reasonable time or the time stated","Death of the offeror"],model:["Five ways: rejection, which ends the acceptability of the offer; revocation at any time prior to acceptance; counteroffer, which operates as a rejection (and a conditional acceptance can be a counteroffer); lapse of time, either a reasonable time or the time provided in the offer; and death of the offeror \u2014 the death of the offeror is the death of the offer.","After termination the offer cannot be accepted."]},{id:"b-c-43",topic:"Revocation through action (\xA7 43)",components:["Power of acceptance ends on definite inconsistent action","\u2026plus the offeree acquiring reliable information of it","No formal revocation notice from the offeror required","Dickinson v. Dodds \u2014 buyer knew of the sale to Allan before 'accepting'","The minds must meet at the moment of acceptance"],model:["Rest. \xA7 43: an offeree's power of acceptance is terminated when the offeror takes definite action inconsistent with an intention to enter into the proposed contract and the offeree acquires reliable information to that effect.","Dickinson v. Dodds: told by a third party that Dodds had sold to Allan, Dickinson could no longer accept \u2014 'it is impossible to say there was ever that existence of the same mind between the two parties which is essential in point of law to the making of an agreement.'"]},{id:"b-c-option",topic:"Option contracts",components:["A bare promise to hold an offer open is a nudum pactum","Consideration paid for irrevocability creates a true option","An option is irrevocable for its stated term","Option acceptances are effective on receipt, not dispatch"],model:["A promise to hold an offer open, unsupported by consideration, is a nudum pactum and does not bind \u2014 the offeror may still revoke (Dickinson v. Dodds).","Where consideration is given for the promise of irrevocability, a true option contract exists and the offer cannot be revoked during its term. Note the timing wrinkle: the mailbox rule does not apply, so an exercise must be received within the option period."]},{id:"b-c-87",topic:"Reliance option (\xA7 87(2))",components:["An offer the offeror should reasonably expect to induce substantial action","\u2026before acceptance, and which does induce it","Is binding as an option contract","To the extent necessary to prevent injustice"],model:["Rest. \xA7 87(2): an offer which the offeror should reasonably expect to induce action or forbearance of a substantial character on the part of the offeree before acceptance, and which does induce such action or forbearance, is binding as an option contract to the extent necessary to prevent injustice.","This is the modern counterweight to Dickinson's hard rule \u2014 the classic application is a subcontractor's bid relied on by a general contractor in its master bid."]},{id:"b-c-consid",topic:"Consideration \u2014 definition and forms",components:["Bargained-for exchange \u2014 sought by the promisor, given in exchange","Form \u2014 a return promise","Form \u2014 performance: an act other than a promise","Form \u2014 performance: forbearance","Form \u2014 performance: affecting legal relations"],model:["Consideration is a bargained-for exchange: something sought by the promisor in exchange for the promise and given by the promisee in exchange for that promise.","Four forms: a return promise; performance by an act other than a promise; performance by forbearance; and performance affecting legal relations."]},{id:"b-c-benefit",topic:"Benefit and detriment",components:["Benefit to the promisor is NOT required","Giving up a legal right you were free to exercise is consideration (Hamer)","Conversely, almost any benefit to the promisor suffices (Langer)","e.g. the advantage of a promisee not working for a competitor"],model:["Consideration does not require benefit to the promisor: abstaining from exercising a legal right you were free to exercise \u2014 drinking, cards, tobacco until twenty-one \u2014 is consideration (Hamer v. Sidway).","Working the other direction, almost any benefit to the promisor will support a promise: 'it is reasonable to conclude that it is to the advantage of the promisor if the promisee is not employed by a competitive company' (Langer v. Superior Steel)."]},{id:"b-c-past",topic:"Past consideration (Dougherty v. Salt)",components:["Consideration already received cannot support a future promise","The aunt's note recited value but nothing was exchanged for it","A gratuitous promise dressed as a contract is still gratuitous"],model:["Consideration that has already been received does not support a future promise (Dougherty v. Salt) \u2014 the aunt's promissory note to her nephew recited consideration, but nothing was sought or given in exchange for it.","This is the same timing defect that later sinks Mills and Harrington."]},{id:"b-c-kirksey",topic:"Gift condition vs. exchange (Kirksey)",components:["A condition merely necessary to receive a gift is not consideration","Test: was the act sought in exchange, or is it how the gift is collected?","Exchange \u2014 going to the store benefits the promisor","Gratuitous condition \u2014 going to the store merely effects the gift"],model:["If the 'consideration' is just a necessary requirement of receiving the gift, it may not be valid consideration (Kirksey v. Kirksey) \u2014 the widow's move was the condition of a gratuity, not a bargained-for exchange.","The test: going to the store to get out of the photograph is an exchange, because it benefits the promisor; going to the store because that is where the gift is handed over is a gratuitous condition."]},{id:"b-c-forbear",topic:"Forbearance of claims (\xA7 74)",components:["Forbearance from asserting a claim is valid consideration","Forbearing an INVALID claim is not, unless\u2026","(a) the claim is in fact doubtful as to facts or law, or","(b) the forbearing party believes it may fairly be determined valid","Good faith separates settlement from extortion"],model:["Forbearance from asserting a claim is valid consideration (Military College Co. v. Brooks).","Rest. 2d \xA7 74(1) limits it: forbearance to assert a claim or defense which proves to be invalid is not consideration unless (a) the claim or defense is in fact doubtful because of uncertainty as to the facts or the law, or (b) the forbearing party believes that the claim or defense may be fairly determined to be valid."]},{id:"b-c-pe",topic:"Promissory estoppel \u2014 elements",components:["A promise \u2014 sufficiently definite, but not a whole contract","Promisor should reasonably expect it to induce action or forbearance","It ACTUALLY induces that action or forbearance","Injustice can be avoided only by enforcement"],model:["Rest. \xA7 90: a promise which the promisor should reasonably expect to induce action or forbearance on the part of the promisee or a third person, and which does induce such action or forbearance, is binding if injustice can be avoided only by enforcement of the promise.","Four elements: (1) a promise \u2014 not an entire contract, but sufficiently definite; (2) the promisor should reasonably expect it to induce action or forbearance, judged by his objective reasonableness; (3) it actually induces that action or forbearance; (4) injustice can be avoided only by enforcement."]},{id:"b-c-pe2",topic:"Promissory estoppel \u2014 scope and limits",components:["Reliance substitutes for consideration","The remedy may be limited as justice requires","The promise need not equal a contractual offer (Stewart)","The promise must PRECEDE the reliance","Gratitude for a completed act induces nothing (Harrington)"],model:["Promissory estoppel makes reliance a substitute for consideration, and the remedy granted for breach may be limited as justice requires.","A \xA7 90 promise need not be the functional equivalent of an offer to enter a contract \u2014 which is why a jury can find no contract but still find estoppel (Stewart v. Cendant).","The hard limit is timing: the promise must come before the reliance. A promise made in gratitude for an act already completed induces nothing (Harrington v. Taylor)."]},{id:"b-c-ue",topic:"Unjust enrichment \u2014 elements",components:["One unjustly enriched at another's expense is liable in restitution","Element 1 \u2014 receipt of a benefit from the plaintiff","Element 2 \u2014 retention of the benefit is unjust","The plaintiff must show BOTH"],model:["A person who is unjustly enriched at the expense of another is subject to liability in restitution. The plaintiff must show both elements: receipt of a benefit from the plaintiff, and that retention of that benefit would be unjust."]},{id:"b-c-ue-benefits",topic:"Unjust enrichment \u2014 what is a benefit",components:["Grant of a possessory interest \u2014 money, land, possessions","Performing services beneficial to or at the request of the defendant","Satisfaction of the defendant's debt","Any other benefit that 'in any way adds to the other's advantage'"],model:["Benefits satisfying element one include: a grant of possessory interest, giving the defendant an interest in money, land, or possessions; performing services that are either beneficial to, or at the request of, the defendant; satisfaction of the defendant's debt; and other benefits \u2014 anything that 'in any way adds to the other's advantage.'"]},{id:"b-c-ue-x",topic:"Unjust enrichment \u2014 exceptions",components:["Unrequested benefit voluntarily conferred (the volunteer)","Choosing gratuity over contracting creates no obligation","Forced exchange","Unrequested services the party wouldn't have bought at market value","Both defeat element two, not element one"],model:["Two exceptions defeat the second element even though a benefit was plainly received. First, an unrequested benefit voluntarily conferred: gratuitously choosing to confer a benefit instead of entering into a contract does not create a compensation obligation. Second, a forced exchange: receiving unrequested services the party would not necessarily have purchased at market value does not create one either."]},{id:"b-c-subordinate",topic:"Restitution is subordinate to contracts",components:["Where a valid contract governs the benefit, it fixes the recovery","Restitution cannot be used to rewrite the bargain","Restatement (Third): the target is enrichment lacking an adequate legal basis","A contract IS an adequate legal basis"],model:["Restitution is subordinate to contracts: where a valid contract governs the exact benefit conferred, it fixes the recovery and unjust enrichment is unavailable.","Restatement (Third) framing: the concern is not unjust enrichment in a broad sense but unjustified enrichment \u2014 enrichment that lacks an adequate legal basis. A valid contract is such a basis."]},{id:"b-c-sparks",topic:"Sparks v. Gustafson",components:["Gustafson managed the building for years without charge or request for payment","Continued after Sparks died, with the executor's knowledge, paying expenses himself","Relationship and delay suggested gratuity \u2014 but did not control","Extent and business character of the services overcame that inference","Distinguished Kershaw's ordinary favors between friends"],model:["Gustafson managed the Nome Center Building for a friend without charge, continued after the owner's death with the executor's knowledge, collected rents, made repairs, and paid expenses out of pocket, never requesting payment until a sale fell through.","The closeness of the relationship and his failure to request payment suggested gratuitous intent, but the extent and professional character of the services overcame it \u2014 services of the sort an ordinary person would expect to pay for. It was inequitable for the Estate to receive them while retaining the benefits, distinguishing Kershaw's ordinary favors."]},{id:"b-c-moral2",topic:"Promises for benefits received \u2014 two types",components:["Gratitude for past actions / moral consideration","\u2026not always enforceable","Subsequent affirmation of an unenforceable promise","\u2026typically enforceable"],model:["Two categories. Gratitude for past actions, or moral consideration \u2014 not always enforceable. And subsequent affirmation of an unenforceable promise \u2014 typically enforceable."]},{id:"b-c-mills",topic:"Mills v. Wyman",components:["Mills, a stranger, nursed Levi Wyman (age 25, independent) who then died","The father afterward promised by letter to pay the expenses","Promise made AFTER the care was complete \u2014 no consideration","Moral obligation alone will not support a promise","No pre-existing legal obligation to revive"],model:["Mills, a stranger, cared for Levi Wyman \u2014 an adult, independent son \u2014 who then died. The father afterward wrote promising to pay the expenses, then refused.","Certain promises for benefits received may be unenforceable notwithstanding any moral obligation: the care was already complete when the promise was made, so nothing was bargained for, and the father had no pre-existing legal obligation to revive. Nonsuit affirmed."]},{id:"b-c-revival",topic:"Pre-existing legal obligation categories",components:["Debts incurred during infancy","Debts barred by the statute of limitations","Debts discharged in bankruptcy","Common thread \u2014 a real legal obligation existed and became unenforceable","The later promise REVIVES it"],model:["Moral obligation can support a promise where it revives a pre-existing legal obligation that became unenforceable for a technical reason: debts incurred during infancy, debts barred by the statute of limitations, and debts discharged in bankruptcy.","In each, a genuine legal obligation once existed and merely lost enforceability \u2014 the new promise revives it rather than creating something from nothing. Wyman had no such obligation, which is why gratitude alone could not bind him."]},{id:"b-c-webb",topic:"Webb v. McGowin",components:["Webb diverted a falling block to save McGowin, crippling himself","McGowin promised to pay him regularly for life, and paid until his death","Moral consideration for a MATERIAL BENEFIT supported the promise","The promisor himself received the direct benefit","Minority position \u2014 Alabama"],model:["Webb, dropping a heavy block from an upper floor of a mill, diverted it to avoid killing McGowin below and was permanently disabled in the process. McGowin promised to pay him a sum regularly for life and paid until he died, whereupon the estate stopped.","The court held the moral consideration for a material benefit supported an enforceable contract. The key anchor: the promisor himself received the direct, material benefit \u2014 his own life. This is a minority position."]},{id:"b-c-harrington",topic:"Harrington v. Taylor",components:["Taylor assaulted his wife; she knocked him down and raised an axe","Harrington caught the blow with her hand, saving him and mutilating it","Taylor promised to pay her damages, paid a small sum, then stopped","Held: a humanitarian act voluntarily performed is not consideration","However much gratitude compels it, the promise is unenforceable"],model:["Taylor assaulted his wife, who took refuge with Harrington; the next day he assaulted her again, she knocked him down with an axe and was about to strike, and Harrington intercepted the blow with her hand, saving his life and mutilating her hand. He promised to pay her damages, paid a small sum, then nothing more.","Held: a voluntary humanitarian act is not such consideration as would entitle her to recover at law, however much the defendant should be impelled by common gratitude. Demurrer sustained, affirmed."]},{id:"b-c-86",topic:"Restatement \xA7 86",components:["A promise in recognition of a benefit previously received by the promisor","\u2026from the promisee","Is binding to the extent necessary to prevent injustice","Not binding if conferred as a gift or the promisor was not unjustly enriched","Not binding to the extent its value is disproportionate to the benefit"],model:["Rest. \xA7 86: a promise made in recognition of a benefit previously received by the promisor from the promisee is binding to the extent necessary to prevent injustice.","Such a promise is not binding if the promisee conferred the benefit as a gift or for other reasons the promisor has not been unjustly enriched, or to the extent that its value is disproportionate to the benefit.","Note the anchor: the benefit must have run to the promisor, from the promisee \u2014 third-party gratitude falls outside."]},{id:"b-c-split",topic:"The moral consideration split",components:["Yes \u2014 a material benefit received can support an enforceable promise","Yes, but \u2014 enforceable only to the extent of the benefit","No \u2014 bargained-for exchange required at the moment of contract","Exams and the bar: argue BOTH the Webb and Harrington interpretations","In practice: advise the client and prepare backup arguments"],model:["Jurisdictions split three ways on whether moral consideration is enough: yes, a material benefit received can support an enforceable promise; yes, but the promise is only enforceable to the extent of the benefit; or no, a bargained-for exchange is required at the moment of contract.","The professor's playbook: on this class's exams and on the bar, write 'if the court uses a Harrington interpretation\u2026' and 'if the court uses a Webb interpretation\u2026'. In practice, advise the partner and client and prepare backup arguments against the competing case law."]}],torts:[{id:"b-t-intent",topic:"Intent",components:["Purpose to cause the contact or apprehension, OR","Knowledge to a substantial certainty that it will result","Intent to HARM is not required","Substantial certainty is higher than risk or recklessness"],model:["Intent is satisfied where the actor acts with the purpose of causing the contact or apprehension, or with knowledge to a substantial certainty that it will result.","Intent to injure is not required \u2014 only intent as to the contact itself. Note the height of the standard: substantial certainty, not mere risk or recklessness."]},{id:"b-t-capacity",topic:"Capacity to form intent",components:["A minor may be liable if capable of forming the requisite intent","Age bears only on experience, capacity, and understanding (Garratt)","Mental disability does not bar intent (Wagner)","The tort needs intent to contact, not appreciation of wrongfulness","Capacity is a factual question, not a categorical defense"],model:["Neither minority nor mental disability is a categorical bar. A minor may be liable for an intentional tort if capable of forming the requisite intent; age matters only insofar as it bears on whether this child, given his experience, capacity, and understanding, knew the contact was substantially certain to follow (Garratt v. Dailey).","A mentally disabled actor can likewise form intent to contact \u2014 the tort does not require appreciation that the act is wrong (Wagner v. State)."]},{id:"b-t-transfer",topic:"Transferred intent",components:["Intent against A transfers when B is injured instead","Intent also transfers between torts","Covers battery, assault, false imprisonment, trespass to land, trespass to chattels","No intent toward the specific victim required"],model:["Where the defendant intends one of the covered intentional torts against one person, that intent transfers to the person actually injured and to the tort actually committed \u2014 no intent toward the specific victim is required (Talmage v. Smith: a stick thrown at one trespassing boy that blinds another supports battery).","The doctrine covers the five historic trespass writs: battery, assault, false imprisonment, trespass to land, and trespass to chattels."]},{id:"b-t-taylor",topic:"Taylor v. Vallelunga \u2014 the transferred intent limit",components:["Daughter watched her father being beaten; she was not touched","No allegation the defendants knew she was present","\u2026or intended to cause HER distress","Transferred intent does not supply bystander IIED","Demurrer sustained; dismissal affirmed"],model:["The plaintiff witnessed a beating of her father and sued for emotional distress. She could not recover: there was no allegation the defendants knew she was present or intended to cause her distress.","Intent directed at the primary victim does not transfer to a bystander's IIED claim \u2014 the bystander must be within the defendant's contemplation."]},{id:"b-t-battery",topic:"Battery \u2014 elements",components:["An intentional act","Causing harmful or offensive contact","With the person of another","Without consent"],model:["Battery: an intentional act causing harmful or offensive contact with the person of another, without consent. Intent runs to the contact, not to the harm \u2014 no physical injury is required, and a plaintiff proving battery without harm may recover nominal damages."]},{id:"b-t-battery2",topic:"Battery \u2014 offensive contact",components:["Offensiveness judged by an ordinary person, in context","Crowded-life contact is not offensive unless rude, insolent, or angry (Wallace)","Contact with anything closely identified with the body counts (Fisher)","Battery protects personal dignity, not just the body"],model:["Offensiveness is judged objectively by ordinary sensibilities and in context \u2014 ordinary contact in the customary give-and-take of crowded life is not offensive unless rude, insolent, or angry (Wallace v. Rosen, a teacher tapping a parent's back during a fire drill).","The contact need not touch the body: anything so closely identified with the person as to be customarily regarded as part of it \u2014 a plate snatched from the hand \u2014 suffices, because battery protects personal dignity (Fisher v. Carrousel Motor Hotel)."]},{id:"b-t-assault",topic:"Assault \u2014 elements",components:["An intentional act","Causing reasonable apprehension","Of an IMMINENT harmful or offensive contact","Apprehension is awareness, not fear"],model:["Assault: an intentional act causing the plaintiff reasonable apprehension of an imminent harmful or offensive contact. Apprehension means awareness of the threatened contact \u2014 it is not fear, so an unafraid plaintiff still has a claim."]},{id:"b-t-assault2",topic:"Assault \u2014 apparent ability",components:["Apparent ability to complete the contact suffices","Actual ability is not required","Judged from a reasonable person's viewpoint","Western Union v. Hill \u2014 the counter may have blocked the reach"],model:["The defendant needs only apparent ability to carry out the threatened contact, judged from the standpoint of a reasonable person in the plaintiff's position; actual ability is not required (Western Union Telegraph Co. v. Hill, where the counter may have made the reach physically impossible)."]},{id:"b-t-fi",topic:"False imprisonment \u2014 elements",components:["An intentional act","Restraint of physical liberty within boundaries fixed by the defendant","Without adequate legal justification","Restraint may be non-physical \u2014 threats, duress, asserted authority"],model:["False imprisonment: an intentional direct restraint of another's physical liberty within boundaries fixed by the defendant, without adequate legal justification.","The restraint need not be physical \u2014 threats, duress, or asserted legal authority suffice, as where a nursing home seized belongings, denied phone use, and retrieved a resident who left (Big Town Nursing Home v. Newman), where egregious disregard of rights also supported punitive damages."]},{id:"b-t-parvi",topic:"False imprisonment \u2014 awareness (Parvi)",components:["The plaintiff must be conscious of the confinement at the time","\u2026or else harmed by it","Later memory of the confinement is NOT required","Intoxicated plaintiff's lack of memory is a jury question, not a bar"],model:["False imprisonment requires that the plaintiff be conscious of the confinement at the time, or else harmed by it. But awareness at the time and memory afterward are different things: a plaintiff who cannot later recall being confined may still recover, so an intoxicated plaintiff's lack of memory presents a jury question rather than a bar (Parvi v. City of Kingston)."]},{id:"b-t-iied",topic:"IIED \u2014 elements",components:["Intentional or reckless conduct","Extreme and outrageous conduct","Causal connection between the conduct and the distress","The distress must be SEVERE"],model:["IIED has four elements: the conduct was intentional or reckless; it was extreme and outrageous; there is a causal connection between the conduct and the emotional distress; and the distress was severe."]},{id:"b-t-harris",topic:"IIED \u2014 severity (Harris v. Jones)",components:["Severity is the usual point of failure","The law expects people to tolerate some rough treatment","Vague or weak evidence of aggravation is insufficient","Outrageous conduct proven, severity not \u2014 plaintiff lost"],model:["Severity is the demanding element. A supervisor mimicked the plaintiff's stutter dozens of times over months \u2014 plainly outrageous \u2014 but the evidence that his distress was severe was too vague and weakly supported, so the claim failed (Harris v. Jones).","The law expects people to tolerate a certain amount of rough treatment; proving outrageousness is not enough."]}],civpro:[{id:"b-cp-smj",topic:"State vs. federal SMJ",components:["State courts \u2014 general SMJ, the catch-all","Federal courts \u2014 limited SMJ","Federal: all federal claims + state claims meeting diversity","SMJ is never waivable \u2014 sua sponte dismissal"],model:["State courts have general subject matter jurisdiction \u2014 they can hear any claim outside exclusive federal SMJ and are always available as a catch-all. Federal courts have limited SMJ: all federal law claims, but state law claims only where diversity requirements are met.","Federal SMJ can never be waived, stipulated, or consented into existence; a judge noticing its absence must dismiss sua sponte."]},{id:"b-cp-caps",topic:"Exclusive, concurrent, and default SMJ",components:["Exclusive federal \u2014 CAPS: copyright, antitrust, patent infringement, securities","Concurrent \u2014 most federal claims, either system","Default \u2014 state court remains when federal requirements fail","Diversity is irrelevant to a CAPS claim"],model:["Exclusive federal jurisdiction is narrow \u2014 CAPS: copyright, antitrust, patent infringement, and securities. Diversity analysis never starts for these; same-state parties are irrelevant.","Most federal claims \u2014 Title VII, for instance \u2014 are concurrent, so either system may hear them. Where neither a federal claim nor diversity exists, state court is the default forum ('default SMJ')."]},{id:"b-cp-complete",topic:"Complete diversity",components:["\xA7 1332(a) \u2014 citizens of different states, exceeding $75,000","No plaintiff may share a state with any defendant","Shared citizenship on the SAME side is fine","One overlapping pair destroys the whole case"],model:["28 U.S.C. \xA7 1332(a): original jurisdiction where the matter in controversy exceeds $75,000, exclusive of interest and costs, and is between citizens of different states.","Complete diversity means no plaintiff may be a citizen of the same state as any defendant. Same-side overlap is irrelevant \u2014 all plaintiffs may be Floridians and all defendants Georgians \u2014 but a single overlapping pair across the v. destroys jurisdiction over the entire case."]},{id:"b-cp-domicile",topic:"Citizenship \u2014 natural persons",components:["A citizen of the state of domicile","Domicile = true, fixed, and permanent home","Always exactly one; never more than one","A child takes the parents' domicile until majority or emancipation"],model:["A natural person is a citizen of the state in which she is domiciled \u2014 her true, fixed, and permanent home. Everyone always has one domicile and never more than one. A child takes the domicile of the parents unless changed at the age of majority or upon emancipation."]},{id:"b-cp-stateless",topic:"Stateless citizens (Friedrich)",components:["A U.S. citizen domiciled abroad is not a citizen of any state","\u2026and is not an alien either","'Stateless' \u2014 fits no \xA7 1332 category","Neither diversity nor alienage jurisdiction is available"],model:["A U.S. citizen domiciled abroad is not a citizen of a state, because domicile is abroad, and is not an alien, because she remains a U.S. citizen \u2014 'stateless' (Friedrich v. Davis).","Such a party fits no \xA7 1332 category, so her presence on either side defeats both diversity and alienage jurisdiction. Chain this with the member rule: one stateless partner makes a partnership un-diverse against anyone."]},{id:"b-cp-corp",topic:"Citizenship \u2014 corporations",components:["Every state by which it has been incorporated","Plus the ONE state of its principal place of business","PPB by the nerve center test (Harrison)","Where officers direct, control, and coordinate \u2014 not where operations occur","BOTH citizenships count for complete diversity"],model:["A corporation is a citizen of every state by which it has been incorporated and of the one state where it has its principal place of business.","The PPB is located by the nerve center test \u2014 the place where officers direct, control, and coordinate the corporation's activities, not where the operations physically happen (Harrison v. Granite Bay Care). Both citizenships count, so a Delaware corporation with a New York nerve center is non-diverse against any New Yorker."]},{id:"b-cp-members",topic:"Citizenship \u2014 partnerships, LLCs, unions",components:["Citizen of every state where ANY partner or member is a citizen","No principal place of business rule applies","One member in the wrong state destroys diversity","The classic trap is treating an LLC like a corporation"],model:["A partnership, LLC, or labor union is a citizen of every state in which any partner or member is a citizen. There is no PPB rule for these \u2014 membership is everything, so an LLC with members in ten states is a citizen of all ten and one member in the wrong state destroys complete diversity."]},{id:"b-cp-legalrep",topic:"Citizenship \u2014 legal representatives",components:["Deemed a citizen only of the represented person's state","\xA7 1332(c)(2)","Covers decedents, infants, and incompetents","The representative's own domicile is ignored"],model:["Under \xA7 1332(c)(2), the legal representative of the estate of a decedent is deemed a citizen only of the same state as the decedent, and the representative of an infant or incompetent only of the same state as that person.","The representative's own domicile is irrelevant: a Georgia executor for a Florida decedent is a Florida citizen for diversity purposes \u2014 which also blocks manufacturing diversity by picking an out-of-state representative."]},{id:"b-cp-timing",topic:"Timing of citizenship",components:["Determined when the lawsuit is commenced","Pre-commencement changes count, regardless of reason","Post-commencement changes never create or destroy diversity","The AIC is likewise fixed at commencement"],model:["A party's citizenship is determined when the lawsuit is commenced. Pre-commencement changes count regardless of the reason \u2014 they may create or destroy diversity, and motive alone is not disqualifying. Post-commencement changes never do, so a defendant cannot escape a federal forum by relocating mid-case.","The amount in controversy is likewise fixed at commencement."]},{id:"b-cp-change",topic:"Changing domicile",components:["Physical presence in the new state \u2014 crossing the line counts","AND intent to make it the true, fixed, permanent home","Both prongs must coincide","Courts test intent with objective evidence (Ceglia)","Residence, property, accounts, voter registration, employment, license, taxes"],model:["A natural person changes domicile by physical presence in the new state \u2014 crossing the state line counts \u2014 plus intent to make it her true, fixed, and permanent home. Both must coincide.","Courts test intent with objective evidence: physical residence, personal and real property, bank and brokerage accounts, voter registration, employment, driver's license and auto registration, and payment of taxes (Ceglia v. Zuckerberg). Saying you have moved is not enough; the paper trail decides."]},{id:"b-cp-alienage",topic:"Alienage \u2014 the basic rule",components:["\xA7 1332(a)(2) \u2014 citizens of a state vs. citizens or subjects of a foreign state","The alien may be on either side","Diversity exists between an alien and a U.S. citizen domiciled in a state","Extra alien parties don't destroy it if a diverse pairing anchors the suit"],model:["Under \xA7 1332(a)(2), jurisdiction exists between citizens of a state and citizens or subjects of a foreign state; the alien may appear on either side of the v.","Additional alien parties do not destroy jurisdiction so long as a properly diverse plaintiff\u2013defendant pairing anchors the suit."]},{id:"b-cp-alienage2",topic:"Alienage \u2014 the limits",components:["LPRA vs. U.S. citizen works \u2014 UNLESS domiciled in the same state","That carve-out is statutory text in \xA7 1332(a)(2)","Alien vs. alien \u2014 never","\u2026even two LPRAs domiciled in different states","\u03C0(MEX) v. \u0394(MEX) + \u0394(FLA) fails until the alien defendant is dropped"],model:["Statutory carve-out: no jurisdiction where a foreign citizen lawfully admitted for permanent residence is domiciled in the same U.S. state as the opposing citizen \u2014 that is written into \xA7 1332(a)(2), not judge-made.","Alienage never exists between two aliens, even where both are LPRAs domiciled in different states. So \u03C0 (MEX) against \u0394 (MEX) and \u0394 (FLA) fails; drop the Mexican defendant and it works."]},{id:"b-cp-aic",topic:"Amount in controversy \u2014 the threshold",components:["Must EXCEED $75,000 \u2014 exactly $75,000 fails","Exclusive of interest and costs","The plaintiff's good-faith allegation controls","Legal certainty test \u2014 it exists unless certain it does not","Recovery below the threshold does not defeat jurisdiction"],model:["The matter in controversy must exceed $75,000, exclusive of interest and costs \u2014 exactly $75,000 fails.","The plaintiff's good-faith allegation controls: if the plaintiff says the amount exists, it exists unless we can say to a legal certainty that it does not. Because the AIC is measured at commencement, a later recovery below the threshold does not retroactively defeat jurisdiction."]},{id:"b-cp-aic2",topic:"Amount in controversy \u2014 what counts",components:["Pre-filing interest counts; post-filing interest does not","Costs never count \u2014 filing fees, court reporters, experts","Attorney fees count only under an exception to the American Rule","Injunctions \u2014 either side's valuation may satisfy (exam rule)","Mitigation reduces the claim (Bush v. Roadway)"],model:["Interest: pre-filing interest counts toward the AIC; post-filing interest does not. Costs \u2014 filing fees, court reporter fees, expert witness fees \u2014 never count. Attorney fees count only where recoverable under some exception to the American Rule.","For injunctions, the exam rule is that the AIC is satisfied if either party's valuation exceeds the threshold. And mitigation reduces the claim: interim wages from a new job are subtracted from a lost-wages figure (Bush v. Roadway Express)."]},{id:"b-cp-agg",topic:"Aggregation rules",components:["One plaintiff + one defendant \u2014 may aggregate all claims, related or not","One plaintiff + multiple defendants \u2014 may NOT aggregate","Multiple plaintiffs + one defendant \u2014 may NOT aggregate","Joint claims count once, at full value against each defendant"],model:["A single plaintiff may aggregate the value of all her claims against a single defendant, related or not. A single plaintiff may not aggregate claims against two different defendants, and two plaintiffs may not aggregate their separate claims against a single defendant.","A joint claim \u2014 joint tortfeasors, or jointly held property or rights \u2014 counts once at full value rather than presenting an aggregation problem, so under joint and several liability the full amount is in controversy against each defendant."]},{id:"b-cp-collusive",topic:"Collusive joinder & realignment",components:["Artificial assignments made solely to manufacture diversity are disregarded","Does NOT reach a genuine unilateral citizenship change","Motive alone is not disqualifying","Realignment by actual interests, not complaint labels","Realignment can create or destroy diversity"],model:["Courts disregard artificial assignments of claims made solely to manufacture diversity. But the doctrine does not reach a genuine, unilateral change of citizenship made to create diversity \u2014 motive alone is not disqualifying, so actually moving your life counts while assigning a claim to a strawman does not.","Separately, the court may realign parties according to their actual interests rather than how the complaint labels them, which can create or destroy diversity."]},{id:"b-cp-drp",topic:"Domestic relations & probate exceptions",components:["Domestic relations \u2014 divorce, alimony, and custody DECREES only","Does NOT bar collection of unpaid spousal or child support [exam]","Probate \u2014 no direct administration of an estate or will","Related tort/misconduct claims against administrators CAN be heard"],model:["The domestic relations exception is narrowly limited to divorce, alimony, and child custody decrees. It does not apply to a collection action to recover unpaid spousal or child support \u2014 the professor flagged this for the exam.","The probate exception means federal courts will not administer an estate or will directly, but they can hear related tort or misconduct claims against those who administer estates."]}]},Qo={contracts:[{id:"l-c-pe",concept:"Promissory estoppel",prompt:"Name the elements of promissory estoppel (Rest. \xA7 90).",slots:[{label:"A promise (sufficiently definite)",keywords:["promise"]},{label:"Promisor should reasonably expect it to induce action or forbearance",keywords:["reasonably expect","should expect","expect to induce"]},{label:"It actually induces that action or forbearance",keywords:["actually","does induce","in fact induce"]},{label:"Injustice can be avoided only by enforcement",keywords:["injustice"]}]},{id:"l-c-consid",concept:"Consideration",prompt:"Name the forms consideration can take.",slots:[{label:"Return promise",keywords:["return promise","promise for a promise","counter promise"]},{label:"Performance: an act other than a promise",keywords:["act other than","an act","performance act"]},{label:"Performance: forbearance",keywords:["forbear"]},{label:"Performance: affecting legal relations",keywords:["legal relation","affecting legal"]}]},{id:"l-c-ue",concept:"Unjust enrichment",prompt:"Name the elements of an unjust enrichment claim.",slots:[{label:"Receipt of a benefit from the plaintiff",keywords:["receipt","benefit conferred","received a benefit","benefit from"]},{label:"Retention of the benefit is unjust",keywords:["retention","retain","unjust","inequitable"]}]},{id:"l-c-ue-x",concept:"Unjust enrichment exceptions",prompt:"Name the exceptions that make retention of a benefit NOT unjust.",slots:[{label:"Unrequested benefit voluntarily conferred (volunteer)",keywords:["voluntar","unrequested","volunteer","gratuitous"]},{label:"Forced exchange",keywords:["forced"]}]},{id:"l-c-offer",concept:"Offer factors",prompt:"Name the factors indicating an offer (8 \u2014 mnemonic: Fuckin Critics Can't Always Judge My Poor Attitude).",slots:[{label:"Finality",keywords:["final"]},{label:"Completeness",keywords:["complete"]},{label:"Context",keywords:["context"]},{label:"Audience",keywords:["audience"]},{label:"Jargon",keywords:["jargon","magic word"]},{label:"Method of acceptance",keywords:["method"]},{label:"Public policy / fairness",keywords:["policy","fair"]},{label:"Accepted practice / course of dealing",keywords:["accepted practice","course of dealing","practice","history"]}]},{id:"l-c-accept",concept:"Acceptance factors",prompt:"Name the acceptance factors (6 \u2014 mnemonic: For My Pretty Panda Ms. Nori).",slots:[{label:"Finality of acceptance",keywords:["final"]},{label:"Method of acceptance",keywords:["method"]},{label:"Acceptance by promise",keywords:["promise"]},{label:"Acceptance by performance",keywords:["performance","perform"]},{label:"Mirror image rule",keywords:["mirror"]},{label:"Notice of acceptance",keywords:["notice"]}]},{id:"l-c-term",concept:"Termination of the offer",prompt:"Name the ways an offer terminates.",slots:[{label:"Rejection",keywords:["reject"]},{label:"Revocation",keywords:["revo"]},{label:"Counteroffer",keywords:["counter"]},{label:"Lapse of time",keywords:["lapse","time","expire"]},{label:"Death of the offeror",keywords:["death","dies","died"]}]},{id:"l-c-mills",concept:"Pre-existing legal obligation categories",prompt:"Name the categories where moral obligation CAN support a promise (Mills).",slots:[{label:"Debts incurred during infancy",keywords:["infan","minor","minority"]},{label:"Debts barred by the statute of limitations",keywords:["limitation","time barred","statute of lim"]},{label:"Debts discharged in bankruptcy",keywords:["bankrupt","discharge"]}]},{id:"l-c-ads",concept:"Advertisement-as-offer test",prompt:"Name the questions for whether an advertisement is an offer.",slots:[{label:"Was performance promised in positive terms in return for something requested?",keywords:["performance","positive terms","promised"]},{label:"Is it clear, definite, explicit \u2014 nothing open for negotiation?",keywords:["definite","clear","explicit","negotiation"]},{label:"Do other facts show the advertiser intended an offer?",keywords:["other facts","circumstance","intent","intended"]}]}],torts:[{id:"l-t-intent",concept:"Intent",prompt:"Name the two ways the intent element is satisfied.",slots:[{label:"Purpose to cause the contact or apprehension",keywords:["purpose","desire","intend to cause"]},{label:"Knowledge to a substantial certainty that it will result",keywords:["substantial certainty","substantially certain","knowledge"]}]},{id:"l-t-battery",concept:"Battery",prompt:"Name the elements of battery.",slots:[{label:"An intentional act",keywords:["intent","intentional act"]},{label:"Causing harmful or offensive contact",keywords:["harmful","offensive","contact"]},{label:"With the person of another",keywords:["person of another","another","plaintiff's person"]},{label:"Without consent",keywords:["consent"]}]},{id:"l-t-assault",concept:"Assault",prompt:"Name the elements of assault.",slots:[{label:"An intentional act",keywords:["intent","intentional act"]},{label:"Causing reasonable apprehension",keywords:["apprehension","reasonable apprehension"]},{label:"Of an imminent harmful or offensive contact",keywords:["imminent","harmful","offensive"]}]},{id:"l-t-fi",concept:"False imprisonment",prompt:"Name the elements of false imprisonment.",slots:[{label:"An intentional act",keywords:["intent","intentional"]},{label:"Restraint of the plaintiff's physical liberty within fixed boundaries",keywords:["restrain","confine","boundar","liberty"]},{label:"Without adequate legal justification",keywords:["justification","authority","lawful","legal justification"]},{label:"Plaintiff conscious of the confinement at the time (or harmed by it)",keywords:["conscious","aware","awareness","knowledge of"]}]},{id:"l-t-iied",concept:"IIED",prompt:"Name the elements of intentional infliction of emotional distress.",slots:[{label:"Intentional or reckless conduct",keywords:["intent","reckless"]},{label:"Extreme and outrageous conduct",keywords:["outrageous","extreme"]},{label:"Causal connection between conduct and distress",keywords:["caus"]},{label:"The emotional distress is SEVERE",keywords:["severe"]}]},{id:"l-t-transfer",concept:"Transferred intent torts",prompt:"Name the torts transferred intent applies to.",slots:[{label:"Battery",keywords:["battery"]},{label:"Assault",keywords:["assault"]},{label:"False imprisonment",keywords:["false imprison","imprison"]},{label:"Trespass to land",keywords:["trespass to land","land"]},{label:"Trespass to chattels",keywords:["chattel"]}]}],civpro:[{id:"l-cp-div",concept:"Diversity jurisdiction",prompt:"Name the requirements for diversity jurisdiction under \xA7 1332(a).",slots:[{label:"Complete diversity of citizenship",keywords:["complete diversity","diverse","different states","citizenship"]},{label:"Amount in controversy exceeding $75,000",keywords:["75,000","75000","amount in controversy","aic"]}]},{id:"l-cp-caps",concept:"Exclusive federal SMJ",prompt:"Name the claims within exclusive federal subject matter jurisdiction (CAPS).",slots:[{label:"Copyright",keywords:["copyright"]},{label:"Anti-trust",keywords:["antitrust","anti-trust","anti trust"]},{label:"Patent infringement",keywords:["patent"]},{label:"Securities",keywords:["securit"]}]},{id:"l-cp-entities",concept:"Citizenship by party type",prompt:"Name the party types whose citizenship is determined by a distinct rule.",slots:[{label:"Natural person \u2014 domicile",keywords:["natural person","individual","domicil","person"]},{label:"Corporation \u2014 incorporation + PPB",keywords:["corporation","incorporat"]},{label:"Partnership / LLC \u2014 every partner or member",keywords:["partnership","llc","member","partner"]},{label:"Legal representative \u2014 the represented person's state",keywords:["representative","executor","estate","decedent"]},{label:"Labor union \u2014 every member",keywords:["union"]}]},{id:"l-cp-agg",concept:"Aggregation rules",prompt:"Name the aggregation rules for the amount in controversy.",slots:[{label:"One plaintiff + one defendant: may aggregate all claims",keywords:["one plaintiff one defendant","single plaintiff","may aggregate","can aggregate"]},{label:"One plaintiff + multiple defendants: no aggregation",keywords:["two defendants","multiple defendants","against two"]},{label:"Multiple plaintiffs + one defendant: no aggregation",keywords:["two plaintiffs","multiple plaintiffs"]},{label:"Joint claims count once at full value",keywords:["joint"]}]},{id:"l-cp-except",concept:"Exceptions to diversity",prompt:"Name the exceptions to diversity jurisdiction.",slots:[{label:"Collusive joinder",keywords:["collusi"]},{label:"Domestic relations",keywords:["domestic"]},{label:"Probate",keywords:["probate"]}]},{id:"l-cp-domicile",concept:"Changing domicile",prompt:"Name what a natural person must show to change domicile.",slots:[{label:"Physical presence in the new state",keywords:["physical","presence","present"]},{label:"Intent to make it the true, fixed, permanent home",keywords:["intent","intend","permanent"]}]}]},Ed={contracts:{title:"Contracts \u2014 attack outline",sections:[{h:"0. Threshold",items:["Goods or services? \u2192 UCC Article 2 vs. common law / Restatement (2d).","Objective theory governs throughout: outward expression, not secret intent (Lucy v. Zehmer)."]},{h:"1. Is there an offer?",items:["\xA7 24: manifestation of willingness, so made as to justify understanding that assent is invited and will conclude it.","\xA7 26 negative: no offer if a further manifestation of assent is required.","Factors (none dispositive): finality \xB7 completeness \xB7 context \xB7 audience \xB7 jargon \xB7 method of acceptance \xB7 policy/fairness \xB7 accepted practice.","Advertisement? \u2192 default invitation (Craft). Exception if performance promised in positive terms, clear/definite/explicit, other facts show intent (Lefkowitz; contrast Leonard).","Price quotation? \u2192 course of dealing + manner of inviting acceptance (Nordyne; Fairmount; contrast Moulton)."]},{h:"2. Was the offer still alive?",items:["Terminated by: rejection \xB7 revocation \xB7 counteroffer \xB7 lapse of time \xB7 death of the offeror.","\xA7 43: definite inconsistent action + reliable information kills the power of acceptance (Dickinson v. Dodds).","Hold-open promise without consideration = nudum pactum, not binding.","Option: supported by consideration \u2192 irrevocable; or \xA7 87(2) substantial pre-acceptance reliance."]},{h:"3. Was there an acceptance?",items:["\xA7 50: manifestation of assent in a manner invited or required by the offer.","Mode: promise (every essential act + notice) vs. performance (part performed/tendered; preparation insufficient). Ambiguous \u2192 either.","Mirror image: material change = counteroffer; \xA7 61 mere request survives unless acceptance depends on it (Ardente).","Notice: required for promise-acceptance (Hendricks); notice to an agent within authority binds the principal.","Timing: \xA7 63(a) acceptance effective on dispatch; revocations/rejections/second-move acceptances on receipt; options on receipt."]},{h:"4. Is there consideration?",items:["Bargained-for exchange: return promise \xB7 act \xB7 forbearance \xB7 affecting legal relations.","Benefit to promisor not required (Hamer); almost any benefit suffices (Langer).","Not consideration: past consideration (Dougherty); a condition merely necessary to receive a gift (Kirksey).","Forbearance of an invalid claim: \xA7 74(1) \u2014 doubtful claim OR honest belief in validity."]},{h:"5. No consideration? Try the substitutes.",items:["Promissory estoppel \xA7 90 \u2014 promise \xB7 reasonably expected to induce \xB7 actually induces \xB7 injustice avoidable only by enforcement. Remedy as justice requires.","Unjust enrichment \u2014 benefit received + retention unjust. Exceptions: volunteer; forced exchange. Subordinate to contracts.","Promise for a benefit already received \u2014 Mills default; pre-existing legal obligation categories (infancy, SOL, bankruptcy); material benefit rule (Webb) vs. refusal (Harrington); \xA7 86 with its gift / no-enrichment / disproportion limits.","Argue BOTH interpretations where the jurisdiction is unsettled \u2014 that is the professor's stated expectation."]}]},torts:{title:"Torts \u2014 attack outline",sections:[{h:"0. Intent gateway",items:["Purpose to cause the contact/apprehension OR knowledge to a substantial certainty it will result.","Intent to harm NOT required; understanding of wrongfulness NOT required.","Capacity: minority (Garratt) and mental disability (Wagner) do not bar intent \u2014 they bear only on capacity to hold the knowledge.","Transferred intent: battery \xB7 assault \xB7 false imprisonment \xB7 trespass to land \xB7 trespass to chattels (Talmage). Not bystander IIED (Taylor)."]},{h:"1. Battery",items:["Intentional act \u2192 harmful or offensive contact \u2192 with the person of another \u2192 without consent.","Offensiveness judged by an ordinary person in context; crowded-life contact is not offensive (Wallace v. Rosen).","Contact with anything closely identified with the body counts (Fisher) \u2014 protects dignity.","No harm required \u2192 nominal damages."]},{h:"2. Assault",items:["Intentional act \u2192 reasonable apprehension \u2192 of imminent harmful or offensive contact.","Apprehension \u2260 fear. Apparent ability suffices; actual ability not required (Western Union v. Hill)."]},{h:"3. False imprisonment",items:["Intentional act \u2192 restraint of physical liberty within fixed boundaries \u2192 without adequate legal justification.","Restraint may be non-physical: threats, duress, asserted authority (Big Town).","Plaintiff must be conscious of confinement at the time, or harmed by it; later memory not required (Parvi)."]},{h:"4. IIED",items:["Intentional or reckless \u2192 extreme and outrageous \u2192 causation \u2192 SEVERE distress.","Severity is the usual failure point (Harris v. Jones).","Bystander: defendant must know of the plaintiff's presence / direct the conduct at them (Taylor v. Vallelunga)."]}]},civpro:{title:"Civil Procedure \u2014 attack outline",sections:[{h:"1. Which court can hear this?",items:["Exclusive federal (CAPS): copyright \xB7 antitrust \xB7 patent infringement \xB7 securities \u2192 federal only.","Federal question but not CAPS \u2192 concurrent, either system.","State law claim \u2192 federal only through diversity; otherwise default state SMJ."]},{h:"2. Complete diversit
